/* atrações dos parques */
const half = (s, l) => { const p = String(s).split(' || '); return p.length > 1 ? p[l] : s; };
const pickName = k => half(k, L());
function parkCount(id){ return PARKS[id].reduce((n, [, it]) => n + it.length, 0); }
const PICON = {R:'ticket',S:'masks-theater',N:'sparkles',T:'walk',P:'user-star',K:'mood-kid',F:'tools-kitchen-2',D:'chef-hat'};
const PGROUP = {R:'R',S:'S',N:'S',T:'T',P:'T',K:'T',F:'F',D:'F'};
function picksForm(dayIdx, id){
  const ro = dayIdx === null || dayIdx === undefined;
  const l = L(), c = CARD[id];
  const pname = SUB[c.sub] ? SUB[c.sub].n[l] : c.n[l];
  const day = ro ? null : S.days[dayIdx];
  const chosen = new Set(ro ? [] : ((day.picks && day.picks[id]) || []));
  let filt = 'all';
  const row = it => {
    const [ty, name, fl, npt, nen] = it; const flags = fl ? fl.split(',') : [];
    const tags = flags.filter(f => f !== 'z').map(f => `<span class="tag ${f === 'x' ? 'new' : ''}">${t('pflag')[f]}</span>`).join('');
    const note = (npt || nen) ? (l ? nen : npt) : '';
    const inner = `<i class="ti ti-${PICON[ty]}" aria-hidden="true"></i><span class="pt">${esc(half(name, l))}${tags}<span class="pn">${esc(t('ptype')[ty])}${note ? ' · ' + (flags.includes('z') ? '<i class="ti ti-alert-circle" aria-hidden="true"></i> ' : '') + esc(note) : ''}</span></span>`;
    return ro ? `<div class="pick ro" data-ty="${PGROUP[ty]}">${inner}</div>`
              : `<label class="pick" data-ty="${PGROUP[ty]}"><input type="checkbox" value="${esc(name)}" ${chosen.has(name) ? 'checked' : ''}>${inner}</label>`;
  };
  const lands = PARKS[id].map(([land, it]) => `<fieldset class="land"><legend>${esc(half(land, l))}</legend>${it.map(row).join('')}</fieldset>`).join('');
  openModal(`<h3>${ro ? esc(pname) : t('pickT') + ': ' + esc(pname)}</h3>
    <p>${ro ? t('pickHint') : esc(dayTitle(DAYS[dayIdx]))}</p>
    <div class="pfilters">${['all','R','S','T','F'].map(f => `<button type="button" class="chip ${f === 'all' ? 'on' : ''}" data-pf="${f}">${t('pf')[f]}</button>`).join('')}</div>
    <div id="plist">${lands}</div>
    <div class="mrow">${ro ? `<button type="button" class="primary" data-close="1">${t('ok')}</button>` :
      `<span class="pcount" id="pcount"></span><button type="button" id="pClear">${t('clear')}</button><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="pSave">${t('save2')}</button>`}</div>`, true);
  const box = $('#mbox');
  const count = () => { const n = box.querySelectorAll('#plist input:checked').length; const pc = $('#pcount'); if (pc) pc.textContent = n + ' ' + t('marked'); };
  box.querySelectorAll('[data-pf]').forEach(b => b.addEventListener('click', () => {
    filt = b.dataset.pf; box.querySelectorAll('[data-pf]').forEach(x => x.classList.toggle('on', x === b));
    box.querySelectorAll('.pick').forEach(r => r.hidden = filt !== 'all' && r.dataset.ty !== filt);
    box.querySelectorAll('.land').forEach(f => f.hidden = ![...f.querySelectorAll('.pick')].some(r => !r.hidden));
  }));
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  if (ro) return;
  box.querySelector('#plist').addEventListener('change', count); count();
  $('#pClear').addEventListener('click', () => { box.querySelectorAll('#plist input').forEach(x => x.checked = false); count(); });
  $('#pSave').addEventListener('click', () => {
    const picked = [...box.querySelectorAll('#plist input:checked')].map(x => x.value);
    day.picks = day.picks || {};
    if (picked.length) day.picks[id] = picked; else delete day.picks[id];
    closeModal(); refreshAfterChange([dayIdx]);
  });
}

/* datas da viagem */
function tripForm(){
  const tr = S.trip || {mode:'dates', start:'', end:'', n:10};
  let mode = tr.mode;
  const today = iso(new Date());
  openModal(`<h3>${t('tripT')}</h3><p>${t('tripP')}</p>
    <div class="types">
      <button type="button" class="chip ${mode === 'dates' ? 'on' : ''}" data-mode="dates"><i class="ti ti-calendar" aria-hidden="true"></i>${t('haveDates')}</button>
      <button type="button" class="chip ${mode === 'count' ? 'on' : ''}" data-mode="count"><i class="ti ti-list-numbers" aria-hidden="true"></i>${t('onlyCount')}</button>
    </div>
    <div id="mDates" ${mode === 'dates' ? '' : 'hidden'}><div class="two">
      <div><label for="tStart">${t('arrive')}</label><input type="date" id="tStart" min="${today}" value="${tr.start || ''}"></div>
      <div><label for="tEnd">${t('leave')}</label><input type="date" id="tEnd" min="${today}" value="${tr.end || ''}"></div>
    </div></div>
    <div id="mCount" ${mode === 'count' ? '' : 'hidden'}><label for="tN">${t('howMany')}</label><input type="number" id="tN" min="1" max="${CONFIG.MAX_DAYS}" value="${tr.n || 10}" style="max-width:140px"></div>
    <div class="tripsum" id="tSum"></div>
    <div class="err" id="tErr"></div>
    <div class="mrow"><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="tOk">${S.trip ? t('updateDays') : t('createDays')}</button></div>`);
  const box = $('#mbox');
  const read = () => {
    if (mode === 'dates') {
      const a = $('#tStart').value, b = $('#tEnd').value;
      if (!a || !b) return {err:t('needDates')};
      const n = Math.round((parseISO(b) - parseISO(a)) / 86400000) + 1;
      if (n < 1) return {err:t('badRange')};
      if (n > CONFIG.MAX_DAYS) return {err:fill(t('tooMany'), {n:CONFIG.MAX_DAYS})};
      return {trip:{mode:'dates', start:a, end:b, n}};
    }
    const n = Math.round(+$('#tN').value);
    if (!(n >= 1)) return {err:t('needDates')};
    if (n > CONFIG.MAX_DAYS) return {err:fill(t('tooMany'), {n:CONFIG.MAX_DAYS})};
    return {trip:{mode:'count', n, start:tr.start || '', end:tr.end || ''}};
  };
  const update = () => {
    const r = read(); $('#tErr').textContent = '';
    if (r.err) { $('#tSum').textContent = ''; return; }
    let msg = tripSummary(r.trip);
    const hidden = []; for (let i = r.trip.n; i < S.days.length; i++) if (dayFilled(i)) hidden.push(i + 1);
    if (hidden.length) msg += '. ' + fill(t(hidden.length === 1 ? 'hiddenWarn1' : 'hiddenWarn'), {list:hidden.join(', ')});
    $('#tSum').textContent = msg;
  };
  box.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    box.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
    $('#mDates').hidden = mode !== 'dates'; $('#mCount').hidden = mode !== 'count'; update();
  }));
  $('#tStart').addEventListener('change', () => { if ($('#tStart').value && (!$('#tEnd').value || $('#tEnd').value < $('#tStart').value)) { $('#tEnd').value = iso(addDays(parseISO($('#tStart').value), 7)); } $('#tEnd').min = $('#tStart').value; update(); });
  $('#tEnd').addEventListener('change', update);
  $('#tN').addEventListener('input', update);
  update();
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  $('#tOk').addEventListener('click', () => {
    const r = read();
    if (r.err) { $('#tErr').textContent = r.err; return; }
    const first = !S.trip;
    S.trip = r.trip; buildDays(); closeModal(); renderAll(); saveNow();
    toast(first ? tripSummary(S.trip) : t('tripChanged'));
  });
}
$('#btnTrip').addEventListener('click', tripForm);
$('#btnSeason').addEventListener('click', () => {
  openModal(`<h3>${t('seasonT')}</h3><p>${t('seasonP')}</p>${SEASON_HTML[S.lang]}<div class="mrow"><button type="button" class="primary" data-close="1">${t('ok')}</button></div>`, true);
  $('#mbox').querySelector('[data-close]').addEventListener('click', closeModal);
});

/* Minhas ideias */
function ideaForm(id){
  const ex = id ? S.ideas.find(x => x.id === id) : null;
  const types = t('ideaTypes');
  const tipo = ex ? ex.tipo : types[0];
  openModal(`<h3>${ex ? t('editIdea') : t('myIdea')}</h3>
    <p>${t('ideaHelp')}</p>
    <label for="iName">${t('name')}</label>
    <input id="iName" value="${ex ? esc(ex.n) : ''}" placeholder="${t('ideaPh')}">
    <div class="err" id="iErr"></div>
    <label>${t('type')}</label>
    <div class="types">${types.map(x => `<button type="button" class="chip ${x === tipo ? 'on' : ''}" data-type="${esc(x)}">${x}</button>`).join('')}</div>
    <label for="iWhere">${t('where')} <span class="opt">${t('whereOpt')}</span></label>
    <input id="iWhere" value="${ex ? esc(ex.onde) : ''}" placeholder="${t('wherePh')}">
    <label for="iNote">${t('note')} <span class="opt">${t('optional')}</span></label>
    <textarea id="iNote" rows="2" placeholder="${t('notePh')}">${ex ? esc(ex.nota) : ''}</textarea>
    <div class="mrow"><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="iSave">${ex ? t('save2') : t('createIdea')}</button></div>`);
  let chosen = tipo;
  $('#mbox').querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
    chosen = b.dataset.type; $('#mbox').querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#iName').addEventListener('input', () => $('#iErr').textContent = '');
  $('#mbox').querySelector('[data-close]').addEventListener('click', closeModal);
  $('#iSave').addEventListener('click', () => {
    const n = $('#iName').value.trim();
    if (!n) { $('#iErr').textContent = t('writeName'); $('#iName').focus(); return; }
    const data = {n, tipo:chosen, onde:$('#iWhere').value.trim(), nota:$('#iNote').value.trim()};
    if (ex) Object.assign(ex, data); else { S.seq += 1; S.ideas.push(Object.assign({id:'ideia-' + S.seq}, data)); }
    openGroups.add('ideias'); closeModal(); renderCatalog(); renderDays(); persist();
    toast(ex ? t('ideaUpdated') : t('ideaCreated'));
  });
}
function deleteIdea(id){
  const idea = S.ideas.find(x => x.id === id); if (!idea) return;
  const n = usedCount(id);
  openModal(`<h3>${t('delIdeaQ')}</h3><p>"${esc(idea.n)}"${n ? ' ' + t('alsoLeaves') + ' ' + n + ' ' + (n === 1 ? t('dayW') : t('daysW')) + ' ' + t('fromPlan') : ''}.</p>
    <div class="mrow"><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="dOk">${t('del')}</button></div>`);
  $('#mbox').querySelector('[data-close]').addEventListener('click', closeModal);
  $('#dOk').addEventListener('click', () => {
    const snap = snapshot();
    S.ideas = S.ideas.filter(x => x.id !== id);
    S.days.forEach(d => SLOTS.forEach(p => d[p] = d[p].filter(x => x !== id)));
    expanded.delete(id); closeModal(); renderAll(); persist(); toast(t('ideaDeleted') + ': ' + idea.n, snap);
  });
}

/* ===== o plano em texto ===== */
function stamp(){ const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function buildMarkdown(){
  const out = [], l = L(), en = S.lang === 'en';
  const filled = DAYS.filter(D => dayFilled(D.i)).length;
  out.push(en ? '# Plan: Búzios, as always' : '# Plano: Búzios, como sempre');
  out.push((en ? 'Saved: ' : 'Salvo em: ') + stamp());
  out.push((en ? 'Trip: ' : 'Viagem: ') + (S.trip ? tripSummary(S.trip) : '-'));
  out.push((en ? 'Days with a plan: ' : 'Dias com plano: ') + filled + ' ' + t('of') + ' ' + DAYS.length);
  out.push('');
  out.push(en ? '## My ideas' : '## Minhas ideias');
  if (!S.ideas.length) out.push(en ? '- none' : '- nenhuma');
  S.ideas.forEach(x => out.push(`- [${x.id}] ${x.n} | ${x.tipo} | ${t('where')}: ${x.onde || '-'} | ${t('note')}: ${x.nota || '-'}`));
  DAYS.forEach(D => {
    const day = S.days[D.i], last = D.i === DAYS.length - 1;
    const extra = [];
    if (D.i === 0) extra.push(t('arrival'));
    if (last && DAYS.length > 1) extra.push(t('departure'));
    if (D.hol) extra.push(t('holiday') + ': ' + D.hol[l]);
    out.push('');
    out.push(`## ${t('day')} ${D.i + 1}${D.date ? ', ' + WD[S.lang][D.wdN] + ' ' + dayShort(D) : ''}${extra.length ? ' (' + extra.join(', ') + ')' : ''}`);
    out.push((en ? 'Day note: ' : 'Nota do dia: ') + (day.note.trim() ? day.note.trim().replace(/\s*\n\s*/g, ' / ') : '-'));
    SLOTS.forEach(p => {
      if (p === 'D' && !day.D.length) return;
      out.push('### ' + pLabel(p));
      if (!day[p].length) out.push(en ? '- empty' : '- vazio');
      day[p].forEach(id => {
        const c = itemInfo(id); if (!c) return;
        const bits = [];
        if (c.food) bits.push(t('eat').toLowerCase());
        if (c.sub && SUB[c.sub]) bits.push(SUB[c.sub].n[l]);
        else if (GROUP[c.g] && c.g !== 'ideias') bits.push(GROUP[c.g].n[l]);
        if (seasonStatus(c) === 'out') bits.push(t('outDates').toLowerCase());
        out.push(`- [${id}] ${c.n[l]}${bits.length ? ' (' + bits.join(', ') + ')' : ''}`);
        const pk = day.picks && day.picks[id];
        if (pk && pk.length) out.push(`  - ${t('wantsTo')}: ${pk.map(pickName).join(', ')}`);
      });
    });
  });
  return out.join('\n');
}
function copyPlan(){
  const md = buildMarkdown(); const done = () => toast(t('copied'));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(md).then(done, () => fallbackCopy(md, done)); else fallbackCopy(md, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { toast(t('copyFail')); }
  ta.remove();
}
function downloadPlan(){
  const blob = new Blob([buildMarkdown()], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'plano-buzios.md';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function savePlan(){
  if (!S.trip) { toast(t('needTrip')); tripForm(); return; }
  saveNow();
  const filled = DAYS.filter(D => dayFilled(D.i)).length;
  openModal(`<h3>${t('saving')}</h3><div class="status"><span class="spin"><i class="ti ti-loader-2" aria-hidden="true"></i></span> ${t('sending')}</div>`);
  const md = buildMarkdown();
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
  let ok = false, msg = '';
  try {
    const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(CONFIG.SEND_TO), {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:'Plano Búzios, salvo em ' + stamp(), _template:'box', _captcha:'false', Viagem:tripSummary(S.trip), Dias_com_plano:filled + ' / ' + DAYS.length, Plano:md})
    });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && (j.success === true || j.success === 'true'); msg = j.message || '';
  } catch(e) { ok = false; }
  clearTimeout(tm);
  if (ok) {
    openModal(`<h3>${t('saved')}</h3>
      <div class="status"><span class="big" style="color:var(--green)"><i class="ti ti-circle-check" aria-hidden="true"></i></span><span>${t('savedMsg')}</span></div>
      <p>${t('savedMore')}</p><div class="mrow"><button type="button" class="primary" data-close="1">${t('ok')}</button></div>`);
  } else {
    openModal(`<h3>${t('failT')}</h3><p>${t('failMsg')} ${msg ? '<br><small>' + esc(msg) + '</small>' : ''}</p><p>${t('failMore')}</p>
      <div class="mrow"><button type="button" data-dl="1">${t('dlFile')}</button><button type="button" data-cp="1">${t('copy')}</button><button type="button" class="primary" data-retry="1">${t('retry')}</button></div>`);
    $('#mbox').querySelector('[data-dl]').addEventListener('click', downloadPlan);
    $('#mbox').querySelector('[data-cp]').addEventListener('click', copyPlan);
    $('#mbox').querySelector('[data-retry]').addEventListener('click', savePlan);
  }
  const c = $('#mbox').querySelector('[data-close]'); if (c) c.addEventListener('click', closeModal);
}
$('#btnSave').addEventListener('click', savePlan);
$('#btnCopy').addEventListener('click', copyPlan);
$('#btnDownload').addEventListener('click', downloadPlan);
$('#btnReset').addEventListener('click', () => {
  openModal(`<h3>${t('resetQ')}</h3><p>${t('resetMsg')}</p>
    <div class="mrow"><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="rOk">${t('eraseAll')}</button></div>`);
  $('#mbox').querySelector('[data-close]').addEventListener('click', closeModal);
  $('#rOk').addEventListener('click', () => { const snap = snapshot(); const lang = S.lang; S = blankState(); S.lang = lang; S.introHidden = true; buildDays(); setIntro(true); closeModal(); renderAll(); persist(); toast(t('wiped'), snap); });
});

/* ===== idioma ===== */
function applyLang(){
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'pt-BR';
  document.title = S.lang === 'en' ? 'Búzios, as always: plan your days' : 'Búzios, como sempre: monte seus dias';
  const v = document.getElementById('ver'); if (v) v.textContent = t('version') + ' ' + CONFIG.VERSION;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  $('#h1').innerHTML = t('h1');
  $('#q').placeholder = t('search'); $('#q').setAttribute('aria-label', t('search'));
  document.querySelectorAll('[data-lang]').forEach(b => { b.classList.toggle('on', b.dataset.lang === S.lang); b.setAttribute('aria-pressed', b.dataset.lang === S.lang); });
}
document.querySelector('.langs').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === S.lang) return;
  S.lang = b.dataset.lang; saveNow(); applyLang(); renderAll(); if (sel) $('#selname').textContent = itemInfo(sel).n[L()];
});

/* ===== início ===== */
function renderAll(){ renderChips(); renderCatalog(); renderDays(); renderCal(); }
load();
buildDays();
applyLang();
setIntro(S.introHidden);
renderAll();
if (!S.trip) setTimeout(tripForm, 350);
$('#ver').textContent = t('version') + ' ' + CONFIG.VERSION;
window.__plan = {buildMarkdown, state:() => S, cards:CARDS.length};
</script>
