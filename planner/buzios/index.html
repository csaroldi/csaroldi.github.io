<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búzios, como sempre: monte seus dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F8F1E3; --paper:#FFFDF8; --ink:#123540; --muted:#5A574E; --faint:#8A8270;
  --line:#E9DCC4; --line2:#D6C4A6;
  --teal:#0A8FA0; --teal-ink:#06606C; --teal-soft:#D9F1F3;
  --coral:#E0653F; --coral-soft:#FCE5DB; --coral-ink:#8C3214;
  --green:#3E8E5A; --green-soft:#E3F1E7; --amber:#C98A1B; --amber-soft:#FAEEDA; --amber-ink:#7A4D06;
  --red:#A32D2D; --c-soft:#EFE9F7; --c-ink:#4A3577;
  --gem:#1F5F8B; --gem-soft:#E1EEF7;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;display:flex;flex-direction:column}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:9px 16px;min-height:42px}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
button.primary:hover{background:var(--teal-ink)}
button.ghost{background:transparent;color:var(--teal);border-color:var(--teal)}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #86D3DC;outline-offset:1px}
a{color:var(--teal)}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:18px 28px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex:none;position:relative}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:500}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;margin:4px 0 2px;letter-spacing:.005em}
h1 b{font-weight:600}
h1 i{font-weight:400;font-size:.72em;color:var(--muted)}
.by{margin:0;font-size:14px;color:var(--muted)}
.by::after{content:"";display:block;width:44px;height:2px;background:var(--coral);margin-top:8px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#progress{font-size:15px;color:var(--ink);font-weight:500;margin-right:6px}
#autosave{font-size:13px;color:var(--green);margin-right:8px}
#autosave i{vertical-align:-2px}
.ver{font-size:12px;color:var(--faint);margin-left:auto}
.langs{position:absolute;top:14px;right:28px;display:flex;gap:6px}
.langs button{min-height:30px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.05em}
.langs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.top .actions{margin-top:34px}
.brand{flex:none}
h1{white-space:nowrap}
#btnTrip{display:inline-flex;align-items:center;gap:8px}

/* intro */
#intro{margin:14px 28px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:20px;align-items:center;flex:none}
#intro ol{margin:0;padding:0;list-style:none;display:flex;gap:22px;flex:1}
#intro li{display:flex;gap:10px;align-items:flex-start;font-size:15px;flex:1}
#intro .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
#intro.hide{display:none}
#introMini{align-self:flex-start;margin:10px 28px 0;min-height:34px;padding:5px 14px;font-size:14px;border-radius:999px;color:var(--teal);border-color:#9FD9E0;background:var(--paper);display:inline-flex;align-items:center;gap:6px;flex:none}
#introMini.hide{display:none}

/* barra de seleção */
#selbar{margin:12px 28px 0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:14px;flex:none;font-size:16px}
#selbar[hidden]{display:none}
#selbar b{font-weight:700}
#selbar button{background:transparent;color:#fff;border-color:#fff;min-height:36px;padding:6px 12px;margin-left:auto}

/* colunas */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,0.9fr) minmax(0,1.1fr);gap:22px;padding:14px 28px 0}
.col{min-height:0;overflow-y:auto;padding-bottom:40px}
.col h2{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 8px}
.lefthead,.righthead{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip i{font-size:15px}
.found{font-size:13px;color:var(--muted);margin-top:8px}

/* grupos */
.grp{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:0;background:transparent;padding:12px 16px;text-align:left;min-height:56px}
.ghead:hover{background:#FCF8F2}
.gbar{width:6px;align-self:stretch;border-radius:4px;flex:none}
.gname{font-weight:500;font-size:17px}
.gsub{font-size:13px;color:var(--muted)}
.gcount{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.gchev{transition:transform .2s;color:var(--muted)}
.grp.open .gchev{transform:rotate(180deg)}
.gbody{padding:4px 12px 12px}
.addidea{width:100%;border-style:dashed;color:var(--c-ink);border-color:#B9A6DA;background:var(--c-soft);font-weight:500;margin:4px 0 8px}

/* cartões */
.card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;background:var(--paper);cursor:grab;position:relative;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(22,50,58,.07)}
.card.sel{border:2px solid var(--teal);padding:7px;background:#F1FAFB}
.card.dragging{opacity:.45}
.card.out{opacity:.62}
.thumb{width:76px;height:64px;border-radius:9px;flex:none;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .3s}
.thumb img.ok{opacity:1}
.cbody{flex:1;min-width:0}
.cname{font-weight:500;font-size:16px;line-height:1.25}
.cmeta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.eff{display:inline-flex;align-items:center;gap:5px}
.eff::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot)}
.e1{--dot:var(--green)}.e2{--dot:var(--amber)}.e3{--dot:var(--red)}.e0{--dot:var(--line2)}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:#F3EDE3;color:var(--muted);white-space:nowrap}
.tag.sleep{background:var(--coral-soft);color:var(--coral-ink)}
.tag.used{background:var(--teal-soft);color:var(--teal-ink)}
.tag.new{background:#FFF1C9;color:#7A5A00;font-weight:500}
.tag.gem{background:var(--gem-soft);color:var(--gem);font-weight:500}
.tag.free{background:var(--green-soft);color:#24603A}
.tag.in{background:var(--green-soft);color:#24603A;font-weight:500}
.tag.out{background:#EEE9E1;color:var(--faint);text-decoration:line-through}
.tag.sun{background:#FDE7D3;color:#8C4A14}
.tag.when{background:#F3EDE3;color:var(--ink)}
.tag.mich{background:#FBE3E3;color:#9B1C1C;font-weight:500}
.card.isfood{border-left:4px solid #B5552F}
.tag.food{background:#F8E3D9;color:#7A3518;font-weight:500}
.tag.br{background:#E2F0E3;color:#1F5A2E}
.price{font-weight:500;color:#7A3518}
.foodsep{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7A3518;font-weight:500;margin:16px 2px 2px;padding-top:10px;border-top:1px dashed var(--line2)}
.it.food{background:#F8E3D9;color:#7A3518}
.sub{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:0;background:#E8F5F6;padding:10px 14px;text-align:left;min-height:52px}
.shead:hover{background:#D9EEF0}
.sname{font-weight:500;font-size:16px;color:var(--teal-ink)}
.shead .gchev{margin-left:auto}
.sub.open .gchev{transform:rotate(180deg)}
.sbody{padding:4px 10px 10px}
.howto{background:#E8F5F6;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;color:var(--teal-ink)}
.howto p{margin:3px 0}
.howto i{vertical-align:-2px}
.cdesc{font-size:14px;color:var(--ink);margin-top:6px;line-height:1.45}
.cdesc a{font-size:13px;white-space:nowrap}
.more{flex:none;width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;font-size:16px;color:var(--muted)}
.ideabtns{display:flex;gap:6px;margin-top:6px}
.ideabtns button{min-height:30px;padding:3px 10px;font-size:13px}
.credit{font-size:12px;color:var(--faint);margin-top:12px}
.empty{font-size:15px;color:var(--muted);padding:20px 4px}

/* calendário */
#cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:4px;max-height:150px;overflow:auto}
.cd{min-height:44px;padding:3px 0;border-radius:8px;font-size:12px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.cd b{font-size:15px;font-weight:500}
.cd.filled{background:var(--teal-soft);border-color:#9FD9E0;color:var(--teal-ink)}
.cd.hol{box-shadow:inset 0 -3px 0 var(--coral)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--sw)}

/* sem datas ainda */
.nodates{background:var(--paper);border:1.5px dashed var(--line2);border-radius:16px;padding:28px;text-align:center;margin-top:10px}
.nodates h3{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 6px}
.nodates p{color:var(--muted);margin:0 0 16px}

/* dias */
.day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;margin-bottom:12px;scroll-margin-top:220px}
.day.edge{border-left:4px solid var(--coral)}
.day.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 4px #86D3DC}100%{box-shadow:0 0 0 0 transparent}}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dn{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
.dt{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
.dt .wd{font-weight:400;color:var(--muted);margin-right:4px}
.dtag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--coral-soft);color:var(--coral-ink);font-weight:500}
.dtag.hol{background:#FDECC8;color:#7A4D06}
.meter{margin-left:auto;font-size:13px;border-radius:999px;padding:2px 10px;font-weight:500}
.m1{background:var(--green-soft);color:#24603A}.m2{background:var(--teal-soft);color:var(--teal-ink)}.m3{background:var(--amber-soft);color:var(--amber-ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.slot{border:1.5px dashed var(--line2);border-radius:10px;padding:7px 8px;min-height:74px;cursor:pointer;transition:background .12s,border-color .12s}
.slot:hover{border-color:var(--teal)}
.slot.over{background:var(--teal-soft);border-color:var(--teal);border-style:solid}
body.selecting .slot{border-color:var(--teal);background:#F1FAFB}
.pl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}
.it{display:flex;align-items:center;gap:4px;background:var(--teal-soft);color:var(--teal-ink);border-radius:8px;padding:4px 4px 4px 9px;margin-top:4px;font-size:14px;line-height:1.25;cursor:grab}
.it.idea{background:var(--c-soft);color:var(--c-ink)}
.it.warn{outline:1.5px dashed var(--coral)}
.it .x{border:0;background:transparent;color:inherit;min-height:26px;width:26px;padding:0;margin-left:auto;font-size:18px;line-height:1;flex:none;border-radius:6px}
.it .x:hover{background:rgba(0,0,0,.08)}
.fixed{display:flex;gap:6px;align-items:flex-start;background:var(--coral-soft);color:var(--coral-ink);border-radius:8px;padding:5px 9px;margin-top:4px;font-size:13px;font-weight:500;line-height:1.3}
.slot .hint{font-size:13px;color:var(--faint)}
.band{margin-top:10px;min-height:50px;background:repeating-linear-gradient(135deg,#FCF8F2,#FCF8F2 10px,#F7F0E5 10px,#F7F0E5 20px)}
.band.has{background:#F1FAFB;border-style:solid;border-color:#9FD9E0}
.slot.busy{opacity:.6}
.it .pk{border:0;background:rgba(255,255,255,.75);color:inherit;min-height:26px;padding:2px 8px;font-size:12px;font-weight:500;border-radius:6px;display:inline-flex;align-items:center;gap:4px;flex:none}
.it .pk:hover{background:#fff}
.it .pk.on{background:var(--teal);color:#fff}
.it .nm{flex:1;min-width:0}
.picked{display:block;font-size:12px;opacity:.85;margin-top:2px}
.subhead{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:14px 4px 0}
.subhead:first-child{margin-top:4px}
.listbtn{margin-top:8px;min-height:34px;padding:5px 12px;font-size:14px;color:var(--teal);border-color:var(--teal);display:inline-flex;gap:6px;align-items:center}
.phint{font-size:13px;color:var(--muted);margin-top:6px}
.land{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:10px 0 0}
.land legend{font-family:var(--serif);font-weight:600;font-size:20px;padding:0 6px}
.mbox .pick,.pick{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:8px;font-size:15px;line-height:1.3;cursor:pointer;margin:0!important;font-weight:400!important}
.pick:hover{background:#FCF8F2}
.pick input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--teal)}
.pick .ti{color:var(--muted);font-size:18px;flex:none}
.pick .pt{flex:1;min-width:0}
.pick .pn{display:block;font-size:13px;color:var(--muted)}
.pick .tag{margin-left:4px}
.pick.ro{cursor:default}
.pick[hidden],.land[hidden]{display:none!important}
.pcount{font-size:15px;font-weight:500;color:var(--teal-ink);margin-right:auto;align-self:center}
.mbox.wide .mrow{position:sticky;bottom:-24px;background:var(--paper);padding:12px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line)}
.pfilters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note{margin-top:8px;min-height:42px;height:42px;resize:vertical;font-size:15px;background:#FCF8F2;border-color:var(--line)}
.rfoot{font-size:13px;color:var(--muted);margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rfoot button{min-height:34px;padding:5px 12px;font-size:13px;color:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(22,50,58,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:16px;max-width:540px;width:100%;padding:24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.mbox.wide{max-width:820px}
.mbox h3{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 6px}
.mbox p{margin:6px 0 12px;font-size:16px;color:var(--muted)}
.mbox label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.mbox .opt{font-weight:400;color:var(--faint)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.types{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--red);font-size:14px;margin-top:6px;min-height:0}
.status{font-size:18px;display:flex;gap:10px;align-items:center;margin:8px 0}
.status .big{font-size:30px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tripsum{background:var(--teal-soft);color:var(--teal-ink);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:12px;min-height:20px}
.tripsum:empty{display:none}

/* maio x setembro */
.season{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.scol{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.scol h4{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 6px}
.scol ul{margin:0;padding-left:18px;font-size:15px}
.scol li{margin:5px 0}
.scol.may{border-top:4px solid var(--teal)}
.scol.sep{border-top:4px solid var(--coral)}
.both{margin-top:12px;background:#FCF8F2;border-radius:12px;padding:10px 14px;font-size:15px}
.both ul{margin:4px 0 0;padding-left:18px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.canundo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
#toast .undo{background:#fff;color:var(--ink);border:0;font-weight:700;min-height:38px;padding:6px 16px;font-size:15px}
#toast .undo:hover{background:var(--coral-soft)}

@media (max-width:980px){
  body{height:auto;display:block}
  .cols{grid-template-columns:1fr;display:block}
  .col{overflow:visible}
  .lefthead,.righthead{position:static}
  #intro ol{flex-direction:column;gap:10px}
  .top{flex-direction:column;align-items:flex-start;padding:16px}
  .langs{right:16px}
  .top .actions{margin-top:4px}
  .actions{justify-content:flex-start}
  .slots{grid-template-columns:1fr}
  .season,.two{grid-template-columns:1fr}
  .cols,#intro,#selbar{margin-left:16px;margin-right:16px;padding-left:0;padding-right:0}
  h1{font-size:34px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="by" data-t="by"></p>
  </div>
  <div class="langs" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="pt">PT</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div class="actions">
    <span id="progress"></span>
    <span id="autosave"><i class="ti ti-check" aria-hidden="true"></i> <span data-t="autosave"></span></span>
    <button id="btnTrip" class="ghost" type="button"><i class="ti ti-calendar" aria-hidden="true"></i><span id="tripLabel"></span></button>
    <button id="btnSeason" class="ghost" type="button"><i class="ti ti-sun" aria-hidden="true"></i><span data-t="season"></span></button>
    <button id="btnCopy" class="ghost" type="button" data-t="copy"></button>
    <button id="btnSave" class="primary" type="button" data-t="save"></button>
  </div>
</header>

<section id="intro" aria-label="Como funciona">
  <ol>

-102 through Arraial."], "join": ["Dá para juntar: Praia Seca e Massambaba de manhã, Lagoa Vermelha e a orla da lagoa à tarde.", "Combine: Praia Seca and Massambaba in the morning, Lagoa Vermelha and the lagoon shore in the afternoon."]}, {"id": "ostras", "car": 55, "wq": "Rio das Ostras, RJ", "n": ["Rio das Ostras e Barra de São João", "Rio das Ostras and Barra de São João"], "how": ["De 50 minutos a uma hora, para o norte pela Amaral Peixoto.", "50 minutes to an hour north on the Amaral Peixoto road."], "join": ["Dá para juntar: Lagoa de Iriry de manhã, almoço e fim de tarde na vila de Barra de São João.", "Combine: Iriry lagoon in the morning, lunch and late afternoon in the village of Barra de São João."]}, {"id": "serra", "car": 120, "wq": "Macaé, RJ", "n": ["Serra: cachoeiras do Sana e Lumiar", "The hills: Sana and Lumiar waterfalls"], "how": ["Duas horas ou mais, com trecho de serra. Bom para trocar o sal pela água doce num dia nublado.", "Two hours or more, with a mountain stretch. Good for swapping salt for fresh water on a cloudy day."], "join": ["Pede o dia todo. Dá para dormir lá e voltar no dia seguinte.", "Takes the whole day. You can stay over and come back the next day."]}]}, {"id": "esp", "n": ["Especiais", "Specials"], "s": ["Casa, mercado, chuva, chegada e volta", "House, groceries, rain, arrival and departure"], "c": "#6B6455", "wq": "Armação dos Búzios, RJ"}];

const PLACES = [["ce01", "centro", "", "Rua das Pedras à noite", "Rua das Pedras at night", "1", "2h", "n,g", "", "", "", "Rua das Pedras", "A rua de pedra do centro, com bares, lojas e música. Melhor depois das 21h. Sapato baixo, o calçamento é irregular.", "The cobbled street in town with bars, shops and music. Best after 9pm. Flat shoes, the stones are uneven.", "moon-stars"], ["ce02", "centro", "", "Orla Bardot e a estátua da Brigitte", "Orla Bardot and the Brigitte statue", "1", "1h", "g,s", "", "", "", "Brigitte Bardot", "O calçadão da Praia da Armação, com a estátua da Brigitte Bardot, o JK e os três pescadores. Lindo no fim da tarde.", "The promenade along Praia da Armação, with the statues of Brigitte Bardot, JK and the three fishermen. Lovely in the late afternoon.", "walk"], ["ce03", "centro", "", "Praia dos Ossos e Igrejinha de Sant'Ana", "Ossos beach and Sant'Ana chapel", "1", "1h", "g,s", "", "", "", "Praia dos Ossos", "Barquinhos coloridos e a capela de 1740 no alto, com vista da baía. Um dos pores do sol mais bonitos da cidade.", "Colourful boats and the 1740 chapel up on the rock, overlooking the bay. One of the prettiest sunsets in town.", "building-church"], ["ce04", "centro", "", "Porto da Barra no fim de tarde", "Porto da Barra at sunset", "1", "2h", "s,n", "", "", "", "", "Conjunto de restaurantes de frente para Manguinhos, com deque sobre a água. Pôr do sol de frente e estacionamento fácil.", "A cluster of restaurants facing Manguinhos, with a deck over the water. Sunset straight ahead and easy parking.", "sunset-2"], ["ce05", "centro", "", "Feira Periurbana", "Feira Periurbana market", "0", "2h", "h,n", "", "", "", "", "Feira de produtores e comida de rua, com música. Quinta à noite e sábado de manhã (conferir). Empanada, hambúrguer, sangria e produtos locais.", "Producers' market and street food with music. Thursday evenings and Saturday mornings (to be checked). Empanadas, burgers, sangria and local produce.", "basket"], ["ce06", "centro", "", "Feira de artesanato da Praça Santos Dumont", "Craft fair at Praça Santos Dumont", "0", "1h", "n", "", "", "", "", "Barraquinhas de artesanato no fim da Rua das Pedras, mais movimentada à noite. Bom para lembrancinha.", "Craft stalls at the end of Rua das Pedras, busiest at night. Good for small gifts.", "palette"], ["ce07", "centro", "", "Lojas e galerias da Travessa dos Pescadores", "Shops and galleries off Rua das Pedras", "1", "1h", "c", "", "", "", "", "As travessas entre a Rua das Pedras e a Manoel Turíbio de Farias, com moda praia, ateliês e galerias. Programa para tarde de chuva.", "The lanes between Rua das Pedras and Manoel Turíbio de Farias, with beachwear, studios and galleries. A rainy-afternoon plan.", "shopping-bag"], ["ce08", "centro", "", "Quilombo da Rasa", "Rasa quilombo community", "1", "2h", "h", "20", "", "", "", "Comunidade quilombola centenária na Rasa, com história, culinária e cultura afro-brasileira. Combinar a visita antes com a associação.", "A century-old quilombo community in Rasa, with history, food and Afro-Brazilian culture. Arrange the visit in advance with the association.", "users-group"], ["ce09", "centro", "", "Música ao vivo no Pátio Havana", "Live music at Pátio Havana", "0", "2h", "n,c", "", "", "", "", "Casa de dois andares na Rua das Pedras com música ao vivo. Pode ser alto, mas é o clássico da noite.", "Two-floor venue on Rua das Pedras with live music. It can be loud, but it is the classic night out.", "music"], ["ce10", "centro", "", "Búzios Golf Club", "Búzios Golf Club", "1", "H", "", "15", "", "", "", "Campo de 18 buracos em Baía Formosa, aberto a visitantes, com aula para iniciante e restaurante.", "An 18-hole course in Baía Formosa, open to visitors, with beginner lessons and a restaurant.", "golf"], ["pc01", "praias", "pc", "Praia de João Fernandes", "João Fernandes beach", "1", "H", "p,k", "", "", "", "Praia de João Fernandes", "Água calma e azul, quiosques com cadeira e guarda-sol, aluguel de máscara para ver peixe na pedra. Chegar antes das 10h.", "Calm blue water, kiosks with chairs and umbrellas, mask rental to see fish by the rocks. Get there before 10am.", "beach"], ["pc02", "praias", "pc", "João Fernandinho", "João Fernandinho", "1", "H", "p,h", "", "", "", "", "A irmã pequena de João Fernandes, ao lado, mais tranquila e boa para snorkel.", "João Fernandes' little sister next door, quieter and good for snorkelling.", "beach"], ["pc03", "praias", "pc", "Azeda e Azedinha", "Azeda and Azedinha", "1", "H", "p", "", "", "", "Praia da Azeda", "Duas prainhas de água transparente, acesso por trilha curta com escada a partir dos Ossos, ou de táxi boat. Na maré cheia a areia some, cuidado com as bolsas.", "Two tiny beaches with clear water, reached by a short trail with steps from Ossos, or by water taxi. At high tide the sand disappears, mind your bags.", "beach"], ["pc04", "praias", "pc", "Praia da Tartaruga", "Tartaruga beach", "1", "H", "p,k", "", "", "", "Praia da Tartaruga (Armação dos Búzios)", "Mar calmo e morno, quiosques rústicos (cadeira grátis se consumir), caiaque e SUP. As escunas param ali, o lado esquerdo é mais tranquilo. Usar o estacionamento.", "Calm, warm sea, rustic kiosks (free chairs if you order), kayak and SUP. The schooners stop there, the left side is quieter. Use the car park.", "beach"], ["pc05", "praias", "pc", "Praia dos Amores do centro", "Amores beach (town side)", "2", "2h", "p,h,g", "", "", "", "", "Prainha quase deserta, só por trilha a partir do canto esquerdo da Praia do Canto. Sem nenhuma estrutura.", "An almost empty little beach, only reachable by trail from the left end of Praia do Canto. No facilities at all.", "beach"], ["pc06", "praias", "pc", "Praia de Manguinhos", "Manguinhos beach", "0", "2h", "p,s,g", "", "", "", "", "Praia rasa e calma do lado do Porto da Barra, cheia de barcos de vela e kite ao fundo. Mais para caminhar e ver o pôr do sol do que para nadar.", "A shallow, calm beach by Porto da Barra, full of sailing boats with kites in the distance. More for walking and sunset than swimming.", "sailboat"], ["fg01", "praias", "fg", "Praia da Ferradura", "Ferradura beach", "1", "H", "p,k", "", "", "", "Praia da Ferradura", "Enseada em forma de ferradura, mar parado, ótima para família. Muitas barracas e aluguel de pedalinho, SUP e caiaque.", "A horseshoe bay with flat water, great for families. Lots of beach stalls and pedalo, SUP and kayak rental.", "beach"], ["fg02", "praias", "fg", "Ferradurinha", "Ferradurinha", "1", "H", "p,k", "", "", "", "Praia da Ferradurinha", "Piscina natural pequena e transparente, quase sem onda. Estacionar no canto esquerdo de Geribá e descer a pé. Chega cedo, enche rápido.", "A small, clear natural pool with almost no waves. Park at the left end of Geribá and walk down. Get there early, it fills fast.", "beach"], ["fg03", "praias", "fg", "Praia de Geribá", "Geribá beach", "1", "H", "p,a", "", "", "", "Praia de Geribá", "A praia grande e animada, com onda, surfe, esportes e barracas. O canto esquerdo é mais calmo.", "The big, lively beach with waves, surfing, sports and stalls. The left end is calmer.", "ripple"], ["fg04", "praias", "fg", "Praia do Forno", "Forno beach", "1", "2h", "p,h", "", "", "", "Praia do Forno (Búzios)", "Prainha de areia avermelhada e água morna e transparente, com trilha curta a partir do mirante. Boa para snorkel.", "A little beach with reddish sand and warm, clear water, reached by a short trail from the viewpoint. Good for snorkelling.", "beach"], ["fg05", "praias", "fg", "Praia da Foca", "Foca beach", "2", "2h", "p,h,g", "", "", "", "", "Uma das menores de Búzios, piscina natural no meio das pedras, trilha de uns 200 metros. Pouca gente.", "One of the smallest in Búzios, a natural pool among the rocks, about 200 metres of trail. Few people.", "beach"], ["fg06", "praias", "fg", "Praia Brava", "Brava beach", "1", "H", "p,s", "", "", "", "Praia Brava (Armação dos Búzios)", "Mar aberto com onda e pedra escorregadia na entrada. Vale pelo cenário e pelo pôr do sol.", "Open sea with waves and slippery rocks at the entrance. Worth it for the scenery and the sunset.", "sunset"], ["fg07", "praias", "fg", "Olho de Boi", "Olho de Boi", "2", "2h", "p,h,g", "", "", "", "Praia Olho de Boi", "A praia de naturismo, nudez obrigatória. Trilha íngreme a partir do canto direito da Brava. Fica aqui para quem quiser saber, não é para todo mundo.", "The naturist beach, nudity required. A steep trail from the right end of Brava. Here for completeness, not for everyone.", "eye"], ["sl01", "praias", "sel", "Praia Rasa", "Rasa beach", "1", "H", "p,h", "20", "", "", "", "Enorme, rasa e quase vazia, boa para dia cheio de feriado. Água mais esverdeada, sem quiosque.", "Huge, shallow and nearly empty, good for a crowded holiday. Greener water, no kiosks.", "beach"], ["sl02", "praias", "sel", "Praia de Tucuns", "Tucuns beach", "1", "H", "p,h", "25", "", "", "", "Praia longa, água azul, pouca estrutura e pouca gente. Ótima para caminhar.", "A long beach with blue water, few facilities and few people. Great for walking.", "beach"], ["sl03", "praias", "sel", "Praia de José Gonçalves", "José Gonçalves beach", "1", "H", "p,h", "30", "", "", "", "Dentro de área de reserva, depois de estrada de terra boa. Frequentada por moradores, com piscinas naturais entre as pedras.", "Inside a reserve, after a decent dirt road. Mostly locals, with natural pools among the rocks.", "beach"], ["sl04", "praias", "sel", "Praia das Caravelas", "Caravelas beach", "1", "2h", "p,h", "30", "", "", "", "Na pontinha de Búzios, quase em Cabo Frio. Tranquila, com mar aberto. É o começo da trilha para a Amendoeira.", "At the very tip of Búzios, almost in Cabo Frio. Quiet, with open sea. It is the start of the trail to Amendoeira.", "beach"], ["ma01", "mar", "", "Passeio de escuna", "Schooner trip", "1", "2h30", "k", "", "", "", "", "Sai do píer da Armação e para em três pontos para banho e snorkel, como João Fernandes e Tartaruga. Bebida e comida a bordo são à parte.", "Leaves from the Armação pier and stops at three spots for swimming and snorkelling, such as João Fernandes and Tartaruga. Food and drinks on board cost extra.", "sailboat"], ["ma02", "mar", "", "Táxi boat entre as praias", "Water taxi between beaches", "0", "1h", "h", "", "", "", "", "Os barquinhos do píer da Armação levam para Azeda, João Fernandes, Tartaruga e outras. Jeito esperto de fugir do estacionamento.", "The little boats from the Armação pier go to Azeda, João Fernandes, Tartaruga and more. A smart way to dodge the parking hunt.", "ship"], ["ma03", "mar", "", "Snorkel em João Fernandes", "Snorkelling at João Fernandes", "1", "2h", "k", "", "", "", "", "Aluguel de máscara na areia e peixinhos nas pedras dos cantos. Tem mini passeio guiado.", "Mask rental on the sand and little fish by the rocks at either end. Short guided swims are available.", "swimming"], ["ma04", "mar", "", "Mergulho de batismo com cilindro", "Try-dive with a tank", "2", "H", "a", "", "", "", "", "Primeiro mergulho com instrutor, saindo de barco para pontos de água clara. Não precisa ter experiência.", "A first dive with an instructor, by boat to clear-water spots. No experience needed.", "scuba-mask"], ["ma05", "mar", "", "Stand up paddle na Ferradurinha", "Stand-up paddle at Ferradurinha", "1", "1h", "k", "", "", "", "", "Água verde e lisa, perfeita para quem nunca subiu na prancha. Aluguel na areia, também na Ferradura e em João Fernandes.", "Smooth green water, perfect for first-timers. Rental on the sand, also at Ferradura and João Fernandes.", "kayak"], ["ma06", "mar", "", "Caiaque até a Praia dos Amores", "Kayak to Praia dos Amores", "2", "2h", "h,a", "", "", "", "", "Saindo da Ferradurinha, remando até a prainha de areia rosada que quase ninguém conhece. Ver tartaruga no caminho é comum.", "From Ferradurinha, paddling to the little pink-sand beach almost nobody knows. Seeing turtles on the way is common.", "kayak"], ["ma07", "mar", "", "Aula de kitesurf", "Kitesurf lesson", "3", "H", "a", "", "", "", "Kitesurfing", "Janeiro tem vento nordeste firme à tarde. As escolas ficam na Rasa e em Manguinhos, com água rasa para aprender.", "January has a steady northeast wind in the afternoons. The schools are at Rasa and Manguinhos, with shallow water to learn in.", "wind"], ["ma08", "mar", "", "Aula de surfe em Geribá", "Surf lesson at Geribá", "2", "2h", "a", "", "", "", "", "Escolinhas na areia de Geribá com prancha grande e instrutor. Melhor de manhã, antes do vento.", "Surf schools on Geribá beach with big boards and an instructor. Best in the morning, before the wind.", "ripple"], ["ma09", "mar", "", "Lancha só para a família", "Private boat for the family", "0", "H", "", "", "", "", "", "Lancha alugada com marinheiro, no horário de vocês e parando onde quiserem. Dividido entre muitos, sai parecido com a escuna.", "A rented boat with skipper, on your schedule and stopping wherever you like. Split between many people, it costs about the same as the schooner.", "speedboat"], ["tr01", "trilhas", "", "Ponta da Lagoinha", "Ponta da Lagoinha", "1", "1h", "g,h,s", "", "", "", "", "Costão de pedra entre a Ferradura e a Foca, com piscinas naturais e mirante. Dois minutos a pé de onde para o carro.", "A rocky point between Ferradura and Foca, with natural pools and a viewpoint. Two minutes' walk from the car.", "mountain"], ["tr02", "trilhas", "", "Rota do Sol, mirante em mirante", "Rota do Sol, viewpoint to viewpoint", "1", "2h", "x,g,s", "", "", "", "", "Circuito turístico oficializado em 2025: mirante da Igrejinha, do Forno, da Brava, Ponta da Lagoinha e Ferradura. Dá para fazer de carro, parando em cada um.", "A tourist circuit made official in 2025: the chapel, Forno, Brava, Ponta da Lagoinha and Ferradura viewpoints. Doable by car, stopping at each.", "route"], ["tr03", "trilhas", "", "Mirante da Ponta do Pai Vitório", "Ponta do Pai Vitório viewpoint", "1", "1h", "x,g,s", "20", "", "", "", "No fim da Praia Rasa, a cidade reformou a trilha em 2025, com dois mirantes e corrimão de madeira. Dez minutos de caminhada.", "At the end of Praia Rasa, the town rebuilt the trail in 2025, with two viewpoints and wooden railings. A ten-minute walk.", "binoculars"], ["tr04", "trilhas", "", "Mangue de Pedra", "The Stone Mangrove", "1", "1h", "h,g", "20", "", "", "", "Manguezal que nasce no meio das pedras, raro no mundo. Fica na Rasa, cinco minutos a pé de onde se estaciona. Junta com o Pai Vitório.", "A mangrove growing among rocks, rare anywhere in the world. In Rasa, five minutes' walk from the car. Pair it with Pai Vitório.", "plant-2"], ["tr05", "trilhas", "", "Trilha das piscinas naturais", "Natural pools trail", "2", "H", "a,h", "", "", "", "", "Da Ferradurinha à Praia dos Amores, piscinas naturais, uma cascatinha de água salgada e a Pedra do Guardião. Com guia, a trilha não tem placa.", "From Ferradurinha to Praia dos Amores, natural pools, a little saltwater cascade and the Guardian Rock. With a guide, the trail has no signs.", "trekking"], ["tr06", "trilhas", "", "Serra das Emerências", "Serra das Emerências", "3", "2h", "a,h,s", "25", "", "", "", "O ponto mais alto de Búzios, 164 metros, subida forte a partir de Tucuns. Pôr do sol sobre a mata. Melhor com guia.", "The highest point in Búzios, 164 metres, a steep climb from Tucuns. Sunset over the forest. Best with a guide.", "mountain"], ["tr07", "trilhas", "", "Trilha Caravelas até a Amendoeira", "Caravelas to Amendoeira trail", "2", "3h", "a,h", "30", "", "", "", "Caminhada pela costa até a Praia da Amendoeira, que só se alcança a pé, e segue até o Pontal do Peró. Um trecho íngreme.", "A coastal walk to Amendoeira beach, reachable only on foot, carrying on to Pontal do Peró. One steep section.", "trekking"], ["tr08", "trilhas", "", "Tartaruga, Virgens, Amores e Canto", "Tartaruga to Canto coastal walk", "2", "3h", "a,h,p", "", "", "", "", "Pelas pedras da costa, passando por prainhas sem estrutura e uma gruta. Só na maré baixa.", "Along the rocky shore, past little beaches with no facilities and a cave. Only at low tide.", "trekking"], ["tr09", "trilhas", "", "Pôr do sol no Mirante da Brava", "Sunset at the Brava viewpoint", "0", "1h", "g,s", "", "", "", "", "O sol caindo no mar aberto. Levar uma canga e chegar uns 30 minutos antes das 19h.", "The sun setting over the open sea. Bring a sarong and arrive about 30 minutes before 7pm.", "sunset-2"], ["tr10", "trilhas", "", "Passeio de buggy", "Buggy tour", "0", "3h", "k", "", "", "", "Dune buggy", "Volta pela península com bugueiro, parando em praias e mirantes. Bom para ver muita coisa num dia só.", "A loop around the peninsula with a driver, stopping at beaches and viewpoints. Good for seeing a lot in one go.", "car"], ["tr11", "trilhas", "", "Quadriciclo pelas trilhas de terra", "Quad bike on the dirt tracks", "2", "2h", "a", "25", "", "", "", "Passeio guiado de quadriciclo ou UTV pelas estradas de terra perto da Serra das Emerências e de José Gonçalves.", "A guided quad or UTV ride on the dirt tracks near Serra das Emerências and José Gonçalves.", "motorbike"], ["ar01", "fora", "arraial", "Barco: Ilha do Farol, Gruta Azul e Prainhas", "Boat: Ilha do Farol, Blue Grotto and Prainhas", "1", "5h", "k", "60", "", "", "Arraial do Cabo", "O passeio clássico saindo da Praia dos Anjos. Para na Ilha do Farol (40 minutos a uma hora, sem bolsa, sem comida, sem sapato), passa pela Gruta Azul e para nas Prainhas. Taxa de embarque de R$ 10 em dinheiro.", "The classic trip from Praia dos Anjos. Stops at Ilha do Farol (40 minutes to an hour, no bags, food or shoes), passes the Blue Grotto and stops at the Prainhas. R$ 10 boarding fee in cash.", "ship"], ["ar02", "fora", "arraial", "Prainhas do Pontal do Atalaia", "Prainhas do Pontal do Atalaia", "2", "H", "p", "60", "", "", "", "Duas prainhas de água azul-turquesa, 250 degraus para descer e subir. Entrada no condomínio de acesso cobrada. A vista da escada é o cartão-postal.", "Two turquoise beaches, 250 steps down and back up. A fee at the access road. The view from the stairs is the postcard.", "stairs"], ["ar03", "fora", "arraial", "Praia do Forno de Arraial", "Forno beach in Arraial", "2", "H", "p", "60", "", "", "", "Trilha de uns 20 minutos com subida, saindo perto da Praia dos Anjos, ou táxi boat. Água clara e gelada.", "A trail of about 20 minutes uphill from near Praia dos Anjos, or a water taxi. Clear, cold water.", "beach"], ["ar04", "fora", "arraial", "Pôr do sol na Praia Grande", "Sunset at Praia Grande", "0", "2h", "p,s,g", "60", "", "", "", "Praia enorme de mar aberto e água muito fria e clara. Os quiosques da orla são o lugar do pôr do sol.", "A huge open-sea beach with very cold, clear water. The kiosks along the front are the sunset spot.", "sunset"], ["ar05", "fora", "arraial", "Mergulho em Arraial", "Diving in Arraial", "2", "H", "a", "60", "", "", "", "Arraial é chamada de capital do mergulho: água fria, transparente e cheia de vida. Batismo com instrutor e fotógrafo.", "Arraial is called the diving capital: cold, clear water full of life. Try-dives with instructor and photographer.", "scuba-mask"], ["ar06", "fora", "arraial", "Prainha e o mirante do canto direito", "Prainha and its right-hand viewpoint", "1", "2h", "p,k", "60", "", "", "", "Praia urbana de água bonita, com estacionamento rotativo pago. O canto direito tem a água mais clara e um mirante.", "A town beach with lovely water and paid street parking. The right end has the clearest water and a viewpoint.", "beach"], ["cf01", "fora", "cabofrio", "Ilha do Japonês", "Ilha do Japonês", "1", "H", "p,k", "40", "", "", "", "Ilhota no canal, água rasa e clara que fica azul com sol e maré certa. Sem aluguel de cadeira, sombra de árvore de graça. Levar lanche e ir em dia de semana.", "A tiny island in the canal, shallow clear water that turns blue with the right sun and tide. No chair rental, free tree shade. Bring snacks and go on a weekday.", "island"], ["cf02", "fora", "cabofrio", "Praia do Peró e Dunas do Peró", "Peró beach and dunes", "1", "H", "p,s", "40", "", "", "Praia do Peró", "Praia longa de bandeira azul e as dunas logo acima, de graça e abertas sempre. Sandboard com aluguel de prancha.", "A long Blue Flag beach with the dunes just above, free and always open. Sandboarding with board rental.", "beach"], ["cf03", "fora", "cabofrio", "Praia das Conchas", "Conchas beach", "1", "2h", "p,k", "40", "", "", "", "Enseada pequena e calma ao lado do Peró. Paga um estacionamento só se juntar com a Ilha do Japonês no mesmo dia.", "A small, calm bay next to Peró. You pay parking once if you pair it with Ilha do Japonês on the same day.", "beach"], ["cf04", "fora", "cabofrio", "Forte São Mateus e Praia do Forte", "São Mateus fort and Praia do Forte", "1", "2h", "p,k", "45", "", "", "Forte de São Mateus", "Forte do século 17 no canto da praia mais famosa de Cabo Frio. O trecho do Lido, perto do forte, é calmo para crianças.", "A 17th-century fort at the end of Cabo Frio's best-known beach. The Lido stretch by the fort is calm for children.", "building-castle"], ["cf05", "fora", "cabofrio", "Passagem e Boulevard Canal à noite", "Passagem and the canal promenade at night", "0", "2h", "n", "45", "", "", "", "O bairro histórico de casinhas coloridas e o calçadão do canal, com restaurantes de frente para a água.", "The historic district of colourful houses and the canal promenade, with restaurants facing the water.", "building-community"], ["cf06", "fora", "cabofrio", "Morro da Guia no pôr do sol", "Morro da Guia at sunset", "1", "1h", "g,s", "45", "", "", "", "Subida de pedra de uns 15 minutos até a capelinha de 1740, com vista do canal e da cidade.", "A cobbled climb of about 15 minutes to the little 1740 chapel, with views over the canal and town.", "building-church"], ["cf07", "fora", "cabofrio", "Rua dos Biquínis", "Rua dos Biquínis", "1", "2h", "c", "40", "", "", "", "Rua inteira de lojas de moda praia de fábrica na Gamboa. Muitas deixam trocar a parte de cima e a de baixo.", "A whole street of factory beachwear shops in Gamboa. Many let you mix tops and bottoms.", "shirt"], ["cf08", "fora", "cabofrio", "Duna Dama Branca", "Dama Branca dune", "2", "1h", "g,s,h", "45", "", "", "", "Duna enorme perto da Praia do Foguete, uns 20 minutos para subir. Pôr do sol de deserto.", "A huge dune near Praia do Foguete, about 20 minutes to climb. A desert sunset.", "mountain"], ["cf09", "fora", "cabofrio", "Lagoa do Foguete", "Lagoa do Foguete", "0", "2h", "g,h", "50", "", "", "", "Lagoa de água escura do lado da praia: nada-se na lagoa olhando o mar. Procurar a Cancela 6.", "A dark-water lagoon beside the beach: you swim in the lagoon looking at the sea. Look for gate 6 (Cancela 6).", "droplet"], ["cf10", "fora", "cabofrio", "Catamarã até a Ilha dos Papagaios", "Catamaran to Ilha dos Papagaios", "1", "3h", "k", "45", "", "", "", "Sai do canal, passa pela Ilha do Japonês, pelo forte e pelo Farol da Lajinha, com duas paradas para banho e snorkel.", "Leaves from the canal, passes Ilha do Japonês, the fort and the Lajinha lighthouse, with two stops to swim and snorkel.", "sailboat"], ["cf11", "fora", "cabofrio", "Casa Ateliê Carlos Scliar", "Carlos Scliar studio house", "0", "1h", "c,h", "45", "", "", "Carlos Scliar", "A casa onde o pintor viveu mais de 40 anos, perto do canal, com obras e vídeos. Bom para dia nublado.", "The house where the painter lived for over 40 years, near the canal, with works and films. Good for a cloudy day.", "palette"], ["cf12", "fora", "cabofrio", "Voo de paramotor", "Paramotor flight", "2", "1h", "a", "45", "", "", "", "Voo duplo sobre o mar e as dunas de Cabo Frio. Para quem quer emoção.", "A tandem flight over Cabo Frio's sea and dunes. For thrill-seekers.", "parachute"], ["lg01", "fora", "lagoa", "Praia Seca e Massambaba", "Praia Seca and Massambaba", "1", "H", "p,h", "75", "", "", "", "Restinga selvagem entre a lagoa e o mar, praia de mar aberto quase sem ninguém. Levar tudo, quase não tem estrutura.", "Wild sandbank between the lagoon and the sea, an open-sea beach with almost nobody. Bring everything, there is hardly anything there.", "beach"], ["lg02", "fora", "lagoa", "Lagoa Vermelha", "Lagoa Vermelha", "0", "1h", "h,g", "70", "", "", "", "Lagoa salgada com estromatólitos, formações vivas raríssimas. A água tem tons avermelhados nas salinas em volta.", "A salt lagoon with stromatolites, very rare living formations. The salt pans around it turn reddish.", "droplet"], ["lg03", "fora", "lagoa", "Salinas e a orla da Lagoa de Araruama", "Salt pans and the Araruama lagoon", "0", "2h", "g", "45", "", "", "Lagoa de Araruama", "A maior lagoa hipersalina do Brasil, com as salinas de moinho na beira da estrada. Bom passeio de carro no fim da tarde.", "Brazil's largest hypersaline lagoon, with windmill salt pans by the road. A nice late-afternoon drive.", "wind-electricity"], ["ro01", "fora", "ostras", "Lagoa de Iriry", "Iriry lagoon", "0", "2h", "h,g,k", "55", "", "", "", "A lagoa Coca-Cola: água escura e morna, cercada de restinga, com passarelas e mirante. Crianças adoram.", "The Coca-Cola lagoon: dark, warm water surrounded by sandbank scrub, with boardwalks and a viewpoint. Children love it.", "droplet"], ["ro02", "fora", "ostras", "Vila de Barra de São João", "Barra de São João village", "0", "H", "h", "50", "", "", "Barra de São João", "Vilarejo onde o rio encontra o mar, com casario antigo, a casa do poeta Casimiro de Abreu e passeio de barco pelo rio.", "A village where the river meets the sea, with old houses, the poet Casimiro de Abreu's home and boat trips up the river.", "home"], ["ro03", "fora", "ostras", "Praia da Tartaruga de Rio das Ostras", "Tartaruga beach in Rio das Ostras", "1", "H", "p,k", "55", "", "", "", "Mar calmo, faixa de areia grande e quiosques. Uma das preferidas das famílias da região.", "Calm sea, a wide strip of sand and kiosks. A favourite with local families.", "beach"], ["ro04", "fora", "ostras", "Museu de Sítio Arqueológico Sambaqui da Tarioba", "Tarioba shell-mound museum", "0", "1h", "c,g,h", "55", "", "", "", "Sambaqui de milhares de anos no centro de Rio das Ostras. Entrada grátis, fecha domingo.", "A shell mound thousands of years old in central Rio das Ostras. Free entry, closed on Sundays.", "building-museum"], ["sr01", "fora", "serra", "Cachoeiras do Sana", "Sana waterfalls", "3", "D", "a,h", "120", "1", "", "", "Vila hippie na serra de Macaé com uma sequência de cachoeiras e poços. Muita trilha. Dá para dormir lá.", "A hippie village in the hills above Macaé with a string of waterfalls and pools. Lots of walking. You can stay over.", "droplet"], ["sr02", "fora", "serra", "Lumiar e São Pedro da Serra", "Lumiar and São Pedro da Serra", "2", "D", "h,c", "135", "1", "", "Lumiar", "Vilas de montanha de Nova Friburgo, com rio, poços e comida boa. Clima fresco, boa troca num dia nublado.", "Mountain villages of Nova Friburgo, with river, pools and good food. Cooler air, a good swap on a cloudy day.", "trees"], ["es01", "esp", "", "Dia de casa", "A day at the house", "0", "D", "", "", "", "", "", "Sem programação: rede, piscina, churrasco, cochilo. Toda viagem precisa de um.", "No plans: hammock, pool, barbecue, nap. Every trip needs one.", "home-heart"], ["es02", "esp", "", "Churrasco em casa", "Barbecue at the house", "0", "", "n", "", "", "", "", "Noite em casa com churrasco, sem fila e sem conta de restaurante.", "An evening at home with a barbecue, no queues and no restaurant bill.", "grill"], ["es03", "esp", "", "Mercado e hortifruti", "Groceries run", "0", "1h", "", "", "", "", "", "Abastecer a casa. Ir cedo ou depois das 20h, em janeiro o mercado lota.", "Stock the house. Go early or after 8pm, in January the supermarket gets packed.", "shopping-cart"], ["es04", "esp", "", "Dia de chuva: Shopping Park Lagos", "Rainy day: Shopping Park Lagos", "0", "H", "c", "40", "", "", "", "Shopping de Cabo Frio com cinema e praça de alimentação. O plano B quando o tempo vira.", "Cabo Frio's mall with a cinema and food court. The plan B when the weather turns.", "building-store"], ["es05", "esp", "", "Manhã cedo na praia", "Early morning on the beach", "1", "2h", "g", "", "", "", "", "Praia às 7h: mar calmo, água clara, areia vazia e vaga para estacionar. Depois volta para casa quando lota.", "Beach at 7am: calm sea, clear water, empty sand and a parking spot. Then head home when it fills up.", "sunrise"]];
const FOOD = [["k01", "centro", "", "Empanaderia Real", "B", "R$", "", "h", "", "Mais de 20 sabores de empanada argentina e pizza individual barata, na rua de trás da Rua das Pedras.", "Over 20 kinds of Argentine empanada and cheap individual pizzas, on the street behind Rua das Pedras."], ["k02", "centro", "", "Chez Michou", "C", "R$", "", "", "", "A creperia mais famosa da Rua das Pedras, há mais de 40 anos. Crepe doce ou salgado. À noite tem fila, de dia não.", "The most famous crêperie on Rua das Pedras, going for over 40 years. Sweet or savoury crêpes. Queues at night, none by day."], ["k03", "centro", "", "La Bella Pasta", "L", "R$", "", "h", "", "Massa simples e barata na Rua Maria Joaquina, dica de quem mora. Prato por menos de R$ 30 (conferir).", "Simple, cheap pasta on Rua Maria Joaquina, a locals' tip. A plate for under R$ 30 (to be checked)."], ["k04", "centro", "", "Carla Gourmet", "L", "R$", "", "h", "", "Almoço caseiro barato numa ruazinha do centro. Comida do dia, sem frescura.", "Cheap home cooking on a side street in town. Dish of the day, no fuss."], ["k05", "centro", "", "Garni", "L", "R$", "", "h", "", "Almoço barato na avenida principal, perto da entrada do centro. Bom para o dia em que ninguém quer gastar.", "A cheap lunch on the main avenue near the way into town. Good for a no-spend day."], ["k06", "centro", "", "Pimenta Síria", "A", "R$$", "", "", "", "Comida árabe caseira, porção generosa: kafta, homus, esfiha. Bom custo-benefício.", "Home-style Arab food, generous portions: kofta, hummus, esfiha. Good value."], ["k07", "centro", "", "Lorenzo Pizzaria e Cantina", "A", "R$$", "", "", "", "Cantina italiana com almoço executivo (entrada, prato e sobremesa) que sai bem mais barato que o jantar.", "An Italian cantina with a set lunch (starter, main and dessert) that costs much less than dinner."], ["k08", "centro", "", "Maria Italiana", "A", "R$$", "", "", "", "Massa feita na casa todo dia. Carbonara e nhoque são os pedidos.", "Pasta made in-ho /* ===== datas e dias ===== */
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }
function addDays(dt, n){ return new Date(dt.getTime() + n*86400000); }
function nthWeekday(y, m, wd, n){ // n=1 primeiro; n=-1 último
  if (n > 0) { const d = new Date(Date.UTC(y, m, 1)); const off = (wd - d.getUTCDay() + 7) % 7; return Date.UTC(y, m, 1 + off + (n-1)*7); }
  const d = new Date(Date.UTC(y, m+1, 0)); const off = (d.getUTCDay() - wd + 7) % 7; return Date.UTC(y, m, d.getUTCDate() - off);
}
const HOLCACHE = {};
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return Date.UTC(y,mo-1,da); }
function holidays(y){
  if (HOLCACHE[y]) return HOLCACHE[y];
  const H = {}, add = (ms, pt, en) => H[iso(new Date(ms))] = [pt, en];
  const E = easter(y), D = 86400000;
  add(Date.UTC(y,0,1),'Ano Novo','New Year');
  add(Date.UTC(y,0,20),'São Sebastião, feriado no Rio','São Sebastião, Rio city holiday');
  add(E - 48*D,'Carnaval','Carnival'); add(E - 47*D,'Carnaval','Carnival');
  add(E - 2*D,'Sexta-feira Santa','Good Friday');
  add(Date.UTC(y,3,21),'Tiradentes','Tiradentes Day');
  add(Date.UTC(y,4,1),'Dia do Trabalho','Labour Day');
  add(Date.UTC(y,8,7),'Independência','Independence Day');
  add(Date.UTC(y,9,12),'Nossa Senhora Aparecida','Our Lady of Aparecida');
  add(Date.UTC(y,10,2),'Finados','All Souls');
  add(Date.UTC(y,10,15),'Proclamação da República','Republic Day');
  add(Date.UTC(y,10,20),'Consciência Negra','Black Consciousness Day');
  add(Date.UTC(y,11,25),'Natal','Christmas');
  return HOLCACHE[y] = H;
}
let DAYS = [];
function buildDays(){
  DAYS = [];
  if (!S.trip) return;
  if (S.trip.mode === 'dates') {
    const a = parseISO(S.trip.start), b = parseISO(S.trip.end);
    const n = Math.round((b - a) / 86400000) + 1;
    for (let i = 0; i < n; i++) {
      const dt = addDays(a, i);
      DAYS.push({i, date:iso(dt), wdN:dt.getUTCDay(), d:dt.getUTCDate(), mN:dt.getUTCMonth(), y:dt.getUTCFullYear(), hol:holidays(dt.getUTCFullYear())[iso(dt)] || null});
    }
  } else {
    for (let i = 0; i < S.trip.n; i++) DAYS.push({i, date:null, hol:null});
  }
  while (S.days.length < DAYS.length) S.days.push(blankDay());
}
function dayTitle(D){
  if (!D.date) return t('day') + ' ' + (D.i + 1);
  return WD[S.lang][D.wdN] + ' ' + D.d + ' ' + MO[S.lang][D.mN];
}
function dayShort(D){ return D.date ? pad(D.d) + '/' + pad(D.mN + 1) : t('day') + ' ' + (D.i+1); }
function fmtDate(s){ const d = parseISO(s); return d.getUTCDate() + ' ' + MO[S.lang][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function tripSummary(trip){
  if (!trip) return '';
  if (trip.mode === 'dates') { const n = Math.round((parseISO(trip.end) - parseISO(trip.start)) / 86400000) + 1; return fill(t('sumDates'), {n, a:fmtDate(trip.start), b:fmtDate(trip.end)}); }
  return fill(t('sumCount'), {n:trip.n});
}

function tripShort(trip){
  if (trip.mode !== 'dates') return trip.n + ' ' + t('days');
  const a = parseISO(trip.start), b = parseISO(trip.end), sep = S.lang === 'en' ? ' to ' : ' a ';
  const f = (d, y) => d.getUTCDate() + ' ' + MO[S.lang][d.getUTCMonth()] + (y ? ' ' + d.getUTCFullYear() : '');
  return f(a, a.getUTCFullYear() !== b.getUTCFullYear()) + sep + f(b, true);
}
/* época de cada cartão */
function windowLabel(w){
  const f = s => { const [m,d] = s.split('-').map(Number); return d + ' ' + MO[S.lang][m-1]; };
  return f(w[0]) + (S.lang === 'en' ? ' to ' : ' a ') + f(w[1]) + (w[2] ? ' ' + w[2] : '');
}
function seasonStatus(c){
  const w = WINDOWS[c.id]; if (!w) return null;
  if (!S.trip || S.trip.mode !== 'dates') return 'na';
  const a = parseISO(S.trip.start), b = parseISO(S.trip.end);
  for (let y = a.getUTCFullYear() - 1; y <= b.getUTCFullYear(); y++) {
    if (w[2] && y < w[2]) continue;
    const ws = parseISO(y + '-' + w[0]);
    let we = parseISO(y + '-' + w[1]);
    if (we < ws) we = parseISO((y+1) + '-' + w[1]);
    if (ws <= b && we >= a) return 'in';
  }
  return 'out';
}

let THUMBS = {};
try { THUMBS = JSON.parse(localStorage.getItem(CONFIG.THUMBS_KEY) || '{}'); } catch(e) { THUMBS = {}; }
const pending = {};
function loadThumb(title){
  if (!title) return Promise.resolve(null);
  if (title in THUMBS) return Promise.resolve(THUMBS[title]);
  if (pending[title]) return pending[title];
  pending[title] = fetch('https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=240&titles=' + encodeURIComponent(title))
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
      const p = pages.find(x => x.thumbnail);
      const src = p ? p.thumbnail.source : null;
      THUMBS[title] = src;
      try { localStorage.setItem(CONFIG.THUMBS_KEY, JSON.stringify(THUMBS)); } catch(e) {}
      return src;
    }).catch(() => null);
  return pending[title];
}
function hydrateThumbs(root){
  root.querySelectorAll('.thumb[data-w]').forEach(el => {
    const w = el.dataset.w; el.removeAttribute('data-w');
    loadThumb(w).then(src => {
      if (!src) return;
      const img = new Image(); img.alt = ''; img.loading = 'lazy';
      img.onload = () => img.classList.add('ok'); img.onerror = () => img.remove();
      img.src = src; el.appendChild(img);
    });
  });
}

function renderCatalog(){
  const col = $('#leftCol'); const keep = col.scrollTop; const l = L();
  const filtering = activeF.size > 0 || query.length > 0;
  let html = '', any = 0;
  const countLabel = list => {
    const ver = list.filter(c => !c.food).length, com = list.filter(c => c.food).length, parts = [];
    if (ver) parts.push(ver + ' ' + t('toSee')); if (com) parts.push(com + ' ' + t('toEat'));
    return parts.join(' · ') || t('nothing');
  };
  const listHTML = list => {
    const ver = list.filter(c => !c.food), com = list.filter(c => c.food);
    return ver.map(cardHTML).join('') + (com.length ? `<div class="foodsep"><i class="ti ti-tools-kitchen-2" aria-hidden="true"></i> ${t('eatHere')}</div>` + com.map(cardHTML).join('') : '');
  };
  GROUPS.forEach(g => {
    const items = g.id === 'ideias' ? S.ideas.map(x => itemInfo(x.id)) : CARDS.filter(c => c.g === g.id);
    const list = items.filter(matches);
    if (filtering && !list.length && g.id !== 'ideias') return;
    if (g.id !== 'ideias') any += list.length;
    const open = openGroups.has(g.id) || (filtering && list.length > 0);
    let body = '';
    if (open) {
      if (g.id === 'ideias') body = `<button type="button" class="addidea" data-add="1">${t('myIdea')}</button>` + list.map(cardHTML).join('');
      else if (g.subs) {
        let lastHead = '';
        body = g.subs.map(sb => {
          const refs = (sb.refs || []).map(x => CARD[x]);
          const all = items.filter(c => c.sub === sb.id).concat(refs), sl = all.filter(matches);
          if (filtering && !sl.length) return '';
          const so = openSubs.has(sb.id) || (filtering && sl.length > 0);
          const hd = sb.head ? (Array.isArray(sb.head) ? sb.head[l] : sb.head) : '';
          const headHTML = hd && hd !== lastHead ? `<div class="subhead">${hd}</div>` : ''; lastHead = hd || lastHead;
          return headHTML + `<div class="sub ${so ? 'open' : ''}">
            <button type="button" class="shead" data-sub="${sb.id}" aria-expanded="${so}">
              <span><span class="sname">${sb.n[l]}</span><br><span class="gsub">${countLabel(filtering ? sl : all)}</span></span>
              <i class="ti ti-chevron-down gchev" aria-hidden="true"></i>
            </button>
            ${so ? `<div class="sbody">${sb.how ? `<div class="howto"><p><i class="ti ti-route" aria-hidden="true"></i> ${sb.how[l]}</p>${sb.join ? `<p><i class="ti ti-link" aria-hidden="true"></i> ${sb.join[l]}</p>` : ''}</div>` : ''}${listHTML(sl)}</div>` : ''}
          </div>`;
        }).join('');
      } else body = listHTML(list);
    }
    html += `<div class="grp ${open ? 'open' : ''}">
      <button type="button" class="ghead" data-g="${g.id}" aria-expanded="${open}">
        <span class="gbar" style="background:${g.c}"></span>
        <span><span class="gname">${g.n[l]}</span><br><span class="gsub">${g.s[l]}</span></span>
        <span class="gcount">${g.id === 'ideias' ? items.length + ' ' + (items.length === 1 ? t('idea') : t('ideas')) : countLabel(filtering ? list : items)}</span>
        <i class="ti ti-chevron-down gchev" aria-hidden="true"></i>
      </button>
      ${open ? `<div class="gbody">${body}</div>` : ''}
    </div>`;
  });
  if (filtering && any === 0) html += `<p class="empty">${t('noneFound')}</p>`;
  $('#found').textContent = filtering ? any + ' ' + t('found') : '';
  const cat = $('#catalog'); cat.innerHTML = html; hydrateThumbs(cat); col.scrollTop = keep;
}

/* ===== dias ===== */
function dayHTML(D){
  const day = S.days[D.i], last = D.i === DAYS.length - 1, l = L();
  const score = dayScore(D.i);
  let meter = '';
  if (score >= 6) meter = `<span class="meter m3">${S.lang === 'en' ? 'Big day' : 'Dia puxado, hein'}</span>`;
  else if (score >= 3) meter = `<span class="meter m2">${S.lang === 'en' ? 'Full day' : 'Dia cheio'}</span>`;
  else if (score > 0) meter = `<span class="meter m1">${S.lang === 'en' ? 'Relaxed' : 'Tranquilo'}</span>`;
  const tags = [];
  if (D.i === 0) tags.push(`<span class="dtag">${t('arrival')}</span>`);
  if (last && DAYS.length > 1) tags.push(`<span class="dtag">${t('departure')}</span>`);
  if (D.hol) tags.push(`<span class="dtag hol">${t('holiday')}: ${esc(D.hol[l])}</span>`);
  const fixedFor = p => {
    const f = [];
    if (D.i === 0 && p === 'T') f.push(t('arrivalHint'));
    if (last && DAYS.length > 1 && p === 'M') f.push(t('departureHint'));
    if (D.hol && p === 'M') f.push(t('hollidayHint'));
    return f.map(x => `<div class="fixed"><i class="ti ti-pin" aria-hidden="true"></i><span>${esc(x)}</span></div>`).join('');
  };
  const itemsFor = p => day[p].map((id, i) => {
      const c = itemInfo(id); if (!c) return '';
      const warn = seasonStatus(c) === 'out';
      const pk = (day.picks && day.picks[id]) || [];
      const pkBtn = PARKS[id] ? `<button type="button" class="pk ${pk.length ? 'on' : ''}" data-pk="1"><i class="ti ti-list-check" aria-hidden="true"></i>${pk.length ? pk.length : t('picksBtn')}</button>` : '';
      const pkList = pk.length ? `<span class="picked">${esc(pk.slice(0,4).map(pickName).join(', '))}${pk.length > 4 ? ' +' + (pk.length - 4) : ''}</span>` : '';
      return `<div class="it ${c.idea ? 'idea' : ''} ${c.food ? 'food' : ''} ${warn ? 'warn' : ''}" draggable="true" data-id="${id}" data-d="${D.i}" data-p="${p}" data-i="${i}" ${warn ? `title="${t('outDates')}"` : ''}>
        <span class="nm">${esc(c.n[l])}${c.s ? ' · ' + t('sleep').toLowerCase() : ''}${warn ? ' <i class="ti ti-alert-triangle" aria-hidden="true"></i>' : ''}${pkList}</span>
        ${pkBtn}<button type="button" class="x" data-rm="1" aria-label="${t('del')} ${esc(c.n[l])}">×</button></div>`;
    }).join('');
  const bandItems = itemsFor('D');
  const band = `<div class="slot band ${bandItems ? 'has' : ''}" data-d="${D.i}" data-p="D"><span class="pl">${t('allDay')}</span>${bandItems || `<span class="hint">${t('bandHint')}</span>`}</div>`;
  const slots = PERIODS.map(p => {
    const fixed = fixedFor(p);
    const items = itemsFor(p);
    const hint = !fixed && !items ? `<span class="hint">${t('dropHere')}</span>` : '';
    return `<div class="slot ${bandItems && p !== 'N' ? 'busy' : ''}" data-d="${D.i}" data-p="${p}"><span class="pl">${pLabel(p)}</span>${fixed}${items}${hint}</div>`;
  }).join('');
  const title = D.date ? `<div class="dt"><span class="wd">${WD[S.lang][D.wdN]}</span>${D.d} ${MO[S.lang][D.mN]}</div>` : `<div class="dt">${t('day')} ${D.i + 1}</div>`;
  return `<article class="day ${D.i === 0 || last ? 'edge' : ''}" id="d-${D.i}">
    <div class="dhead">${D.date ? `<span class="dn">${t('day')} ${D.i + 1}</span>` : ''}${title}${tags.join('')}${meter}</div>
    ${band}<div class="slots">${slots}</div>
    <textarea class="note" data-note="${D.i}" rows="1" placeholder="${t('dayNote')}" aria-label="${esc(dayTitle(D))}">${esc(day.note)}</textarea>
  </article>`;
}

/* ===== ações ===== */
function addTo(i, p, id){
  i = +i; if (!itemInfo(id) || !S.days[i]) return;
  if (CARD[id] && CARD[id].dur === 'D') p = 'D';
  S.days[i][p].push(id); refreshAfterChange([i]);
  toast(itemInfo(id).n[L()] + ' ' + t('enteredIn') + ' ' + dayTitle(DAYS[i]));
}
function removeAt(i, p, k){
  i = +i; const snap = snapshot(); const id = S.days[i][p][k]; const c = itemInfo(id);
  S.days[i][p].splice(k, 1);
  if (S.days[i].picks && S.days[i].picks[id] && !SLOTS.some(q => S.days[i][q].includes(id))) delete S.days[i].picks[id];
  refreshAfterChange([i]);
  toast((c ? c.n[L()] : 'Item') + ' ' + t('leftFrom') + ' ' + dayTitle(DAYS[i]), snap);
}
function moveItem(from, i, p){
  i = +i; const fd = +from.d; const id = S.days[fd][from.p][from.i]; if (!id) return;
  if (CARD[id] && CARD[id].dur === 'D') p = 'D';
  S.days[fd][from.p].splice(from.i, 1); S.days[i][p].push(id);
  const pkm = S.days[fd].picks && S.days[fd].picks[id];
  if (pkm && fd !== i) { S.days[i].picks = S.days[i].picks || {}; if (!S.days[i].picks[id]) S.days[i].picks[id] = pkm; if (!SLOTS.some(q => S.days[fd][q].includes(id))) delete S.days[fd].picks[id]; }
  refreshAfterChange(fd === i ? [i] : [fd, i]);
}
function setSel(id){
  sel = id; document.body.classList.toggle('selecting', !!id); $('#selbar').hidden = !id;
  if (id) $('#selname').textContent = itemInfo(id).n[L()];

}

/* arrastar */
let dragData = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.card');
  const it = e.target.closest && e.target.closest('.it');
  if (it) dragData = {id:it.dataset.id, from:{d:it.dataset.d, p:it.dataset.p, i:+it.dataset.i}};
  else if (card) dragData = {id:card.dataset.id};
  else return;
  e.dataTransfer.effectAllowed = 'copyMove';
  try { e.dataTransfer.setData('text/plain', JSON.stringify(dragData)); } catch(_) {}
  (it || card).classList.add('dragging');
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over'));
  dragData = null;
});
function readDrag(e){ if (dragData) return dragData; try { return JSON.parse(e.dataTransfer.getData('text/plain')); } catch(_) { return null; } }
const daysEl = $('#days');
daysEl.addEventListener('dragover', e => {
  const s = e.target.closest('.slot'); if (!s) return;
  e.preventDefault();
  daysEl.querySelectorAll('.slot.over').forEach(x => { if (x !== s) x.classList.remove('over'); });
  s.classList.add('over');
});
daysEl.addEventListener('dragleave', e => { const s = e.target.closest('.slot'); if (s && !s.contains(e.relatedTarget)) s.classList.remove('over'); });
daysEl.addEventListener('drop', e => {
  const s = e.target.closest('.slot'); if (!s) return;
  e.preventDefault(); s.classList.remove('over');
  const data = readDrag(e); if (!data) return;
  if (data.from) moveItem(data.from, s.dataset.d, s.dataset.p); else addTo(s.dataset.d, s.dataset.p, data.id);
  dragData = null;
});
const leftCol = $('#leftCol');
leftCol.addEventListener('dragover', e => { if (dragData && dragData.from) e.preventDefault(); });
