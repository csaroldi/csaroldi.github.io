<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilha Grande pelo Abraão: monte seus dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F2F1E7; --paper:#FFFEF9; --ink:#14342E; --muted:#56574C; --faint:#868470;
  --line:#E1DDC9; --line2:#CDC6A9;
  --teal:#0B7A6E; --teal-ink:#06514A; --teal-soft:#D6EEE7;
  --coral:#C9662C; --coral-soft:#FBE7D7; --coral-ink:#7C3512;
  --green:#3E8E5A; --green-soft:#E3F1E7; --amber:#C98A1B; --amber-soft:#FAEEDA; --amber-ink:#7A4D06;
  --red:#A32D2D; --c-soft:#EFE9F7; --c-ink:#4A3577;
  --gem:#1F5F8B; --gem-soft:#E1EEF7;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;display:flex;flex-direction:column}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:9px 16px;min-height:42px}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
button.primary:hover{background:var(--teal-ink)}
button.ghost{background:transparent;color:var(--teal);border-color:var(--teal)}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #86C7B3;outline-offset:1px}
a{color:var(--teal)}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:18px 28px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex:none;position:relative}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:500}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;margin:4px 0 2px;letter-spacing:.005em}
h1 b{font-weight:600}
h1 i{font-weight:400;font-size:.72em;color:var(--muted)}
.by{margin:0;font-size:14px;color:var(--muted)}
.by::after{content:"";display:block;width:44px;height:2px;background:var(--coral);margin-top:8px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#progress{font-size:15px;color:var(--ink);font-weight:500;margin-right:6px}
#autosave{font-size:13px;color:var(--green);margin-right:8px}
#autosave i{vertical-align:-2px}
.ver{font-size:12px;color:var(--faint);margin-left:auto}
.langs{position:absolute;top:14px;right:28px;display:flex;gap:6px}
.langs button{min-height:30px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.05em}
.langs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.top .actions{margin-top:34px}
.brand{flex:none}
h1{white-space:nowrap}
#btnTrip{display:inline-flex;align-items:center;gap:8px}

/* intro */
#intro{margin:14px 28px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:20px;align-items:center;flex:none}
#intro ol{margin:0;padding:0;list-style:none;display:flex;gap:22px;flex:1}
#intro li{display:flex;gap:10px;align-items:flex-start;font-size:15px;flex:1}
#intro .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
#intro.hide{display:none}
#introMini{align-self:flex-start;margin:10px 28px 0;min-height:34px;padding:5px 14px;font-size:14px;border-radius:999px;color:var(--teal);border-color:#9BD0BF;background:var(--paper);display:inline-flex;align-items:center;gap:6px;flex:none}
#introMini.hide{display:none}

/* barra de seleção */
#selbar{margin:12px 28px 0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:14px;flex:none;font-size:16px}
#selbar[hidden]{display:none}
#selbar b{font-weight:700}
#selbar button{background:transparent;color:#fff;border-color:#fff;min-height:36px;padding:6px 12px;margin-left:auto}

/* colunas */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,0.9fr) minmax(0,1.1fr);gap:22px;padding:14px 28px 0}
.col{min-height:0;overflow-y:auto;padding-bottom:40px}
.col h2{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 8px}
.lefthead,.righthead{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip i{font-size:15px}
.found{font-size:13px;color:var(--muted);margin-top:8px}

/* grupos */
.grp{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:0;background:transparent;padding:12px 16px;text-align:left;min-height:56px}
.ghead:hover{background:#F9F7EE}
.gbar{width:6px;align-self:stretch;border-radius:4px;flex:none}
.gname{font-weight:500;font-size:17px}
.gsub{font-size:13px;color:var(--muted)}
.gcount{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.gchev{transition:transform .2s;color:var(--muted)}
.grp.open .gchev{transform:rotate(180deg)}
.gbody{padding:4px 12px 12px}
.addidea{width:100%;border-style:dashed;color:var(--c-ink);border-color:#B9A6DA;background:var(--c-soft);font-weight:500;margin:4px 0 8px}

/* cartões */
.card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;background:var(--paper);cursor:grab;position:relative;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(20,52,46,.07)}
.card.sel{border:2px solid var(--teal);padding:7px;background:#EEF7F3}
.card.dragging{opacity:.45}
.card.out{opacity:.62}
.thumb{width:76px;height:64px;border-radius:9px;flex:none;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .3s}
.thumb img.ok{opacity:1}
.cbody{flex:1;min-width:0}
.cname{font-weight:500;font-size:16px;line-height:1.25}
.cmeta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.eff{display:inline-flex;align-items:center;gap:5px}
.eff::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot)}
.e1{--dot:var(--green)}.e2{--dot:var(--amber)}.e3{--dot:var(--red)}.e0{--dot:var(--line2)}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:#ECEADD;color:var(--muted);white-space:nowrap}
.tag.sleep{background:var(--coral-soft);color:var(--coral-ink)}
.tag.used{background:var(--teal-soft);color:var(--teal-ink)}
.tag.new{background:#FFF1C9;color:#7A5A00;font-weight:500}
.tag.gem{background:var(--gem-soft);color:var(--gem);font-weight:500}
.tag.free{background:var(--green-soft);color:#24603A}
.tag.in{background:var(--green-soft);color:#24603A;font-weight:500}
.tag.out{background:#EEE9E1;color:var(--faint);text-decoration:line-through}
.tag.sun{background:#FDE7D3;color:#8C4A14}
.tag.when{background:#ECEADD;color:var(--ink)}
.tag.sea{background:#E1EDF5;color:#1F4E73}
.tag.pb{background:#E6F0DE;color:#355A1F}
.oplink{font-size:12px;margin-left:6px;white-space:nowrap}
.months{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mon{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.mon summary{cursor:pointer;padding:10px 14px;font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;list-style:none}
.mon summary::-webkit-details-marker{display:none}
.mon summary .ms{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted)}
.mon.yours{border-color:var(--teal);border-width:2px}
.mon.yours summary::after{content:"";margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.mon dl{margin:0;padding:0 14px 12px;display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:15px}
.mon dt{color:var(--muted);font-weight:500}
.mon dd{margin:0}
.mhint{font-size:14px;color:var(--teal-ink);background:var(--teal-soft);border-radius:10px;padding:8px 12px;margin-top:8px}
@media (max-width:600px){.mon dl{grid-template-columns:1fr}h1{white-space:normal!important;font-size:30px!important;padding-right:92px}}
.tag.mich{background:#FBE3E3;color:#9B1C1C;font-weight:500}
.card.isfood{border-left:4px solid #B5552F}
.tag.food{background:#F8E3D9;color:#7A3518;font-weight:500}
.tag.br{background:#E2F0E3;color:#1F5A2E}
.price{font-weight:500;color:#7A3518}
.foodsep{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7A3518;font-weight:500;margin:16px 2px 2px;padding-top:10px;border-top:1px dashed var(--line2)}
.it.food{background:#F8E3D9;color:#7A3518}
.sub{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:0;background:#E5F2EC;padding:10px 14px;text-align:left;min-height:52px}
.shead:hover{background:#D2EBE2}
.sname{font-weight:500;font-size:16px;color:var(--teal-ink)}
.shead .gchev{margin-left:auto}
.sub.open .gchev{transform:rotate(180deg)}
.sbody{padding:4px 10px 10px}
.howto{background:#E5F2EC;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;color:var(--teal-ink)}
.howto p{margin:3px 0}
.howto i{vertical-align:-2px}
.cdesc{font-size:14px;color:var(--ink);margin-top:6px;line-height:1.45}
.cdesc a{font-size:13px;white-space:nowrap}
.more{flex:none;width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;font-size:16px;color:var(--muted)}
.ideabtns{display:flex;gap:6px;margin-top:6px}
.ideabtns button{min-height:30px;padding:3px 10px;font-size:13px}
.credit{font-size:12px;color:var(--faint);margin-top:12px}
.empty{font-size:15px;color:var(--muted);padding:20px 4px}

/* calendário */
#cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:4px;max-height:150px;overflow:auto}
.cd{min-height:44px;padding:3px 0;border-radius:8px;font-size:12px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.cd b{font-size:15px;font-weight:500}
.cd.filled{background:var(--teal-soft);border-color:#9BD0BF;color:var(--teal-ink)}
.cd.hol{box-shadow:inset 0 -3px 0 var(--coral)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--sw)}

/* sem datas ainda */
.nodates{background:var(--paper);border:1.5px dashed var(--line2);border-radius:16px;padding:28px;text-align:center;margin-top:10px}
.nodates h3{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 6px}
.nodates p{color:var(--muted);margin:0 0 16px}

/* dias */
.day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;margin-bottom:12px;scroll-margin-top:220px}
.day.edge{border-left:4px solid var(--coral)}
.day.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 4px #86C7B3}100%{box-shadow:0 0 0 0 transparent}}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dn{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
.dt{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
.dt .wd{font-weight:400;color:var(--muted);margin-right:4px}
.dtag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--coral-soft);color:var(--coral-ink);font-weight:500}
.dtag.hol{background:#FDECC8;color:#7A4D06}
.meter{margin-left:auto;font-size:13px;border-radius:999px;padding:2px 10px;font-weight:500}
.m1{background:var(--green-soft);color:#24603A}.m2{background:var(--teal-soft);color:var(--teal-ink)}.m3{background:var(--amber-soft);color:var(--amber-ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.slot{border:1.5px dashed var(--line2);border-radius:10px;padding:7px 8px;min-height:74px;cursor:pointer;transition:background .12s,border-color .12s}
.slot:hover{border-color:var(--teal)}
.slot.over{background:var(--teal-soft);border-color:var(--teal);border-style:solid}
body.selecting .slot{border-color:var(--teal);background:#EEF7F3}
.pl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}
.it{display:flex;align-items:center;gap:4px;background:var(--teal-soft);color:var(--teal-ink);border-radius:8px;padding:4px 4px 4px 9px;margin-top:4px;font-size:14px;line-height:1.25;cursor:grab}
.it.idea{background:var(--c-soft);color:var(--c-ink)}
.it.warn{outline:1.5px dashed var(--coral)}
.it .x{border:0;background:transparent;color:inherit;min-height:26px;width:26px;padding:0;margin-left:auto;font-size:18px;line-height:1;flex:none;border-radius:6px}
.it .x:hover{background:rgba(0,0,0,.08)}
.fixed{display:flex;gap:6px;align-items:flex-start;background:var(--coral-soft);color:var(--coral-ink);border-radius:8px;padding:5px 9px;margin-top:4px;font-size:13px;font-weight:500;line-height:1.3}
.slot .hint{font-size:13px;color:var(--faint)}
.band{margin-top:10px;min-height:50px;background:repeating-linear-gradient(135deg,#F9F7EE,#F9F7EE 10px,#F2EFE2 10px,#F2EFE2 20px)}
.band.has{background:#EEF7F3;border-style:solid;border-color:#9BD0BF}
.slot.busy{opacity:.6}
.it .pk{border:0;background:rgba(255,255,255,.75);color:inherit;min-height:26px;padding:2px 8px;font-size:12px;font-weight:500;border-radius:6px;display:inline-flex;align-items:center;gap:4px;flex:none}
.it .pk:hover{background:#fff}
.it .pk.on{background:var(--teal);color:#fff}
.it .nm{flex:1;min-width:0}
.picked{display:block;font-size:12px;opacity:.85;margin-top:2px}
.subhead{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:14px 4px 0}
.subhead:first-child{margin-top:4px}
.listbtn{margin-top:8px;min-height:34px;padding:5px 12px;font-size:14px;color:var(--teal);border-color:var(--teal);display:inline-flex;gap:6px;align-items:center}
.phint{font-size:13px;color:var(--muted);margin-top:6px}
.land{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:10px 0 0}
.land legend{font-family:var(--serif);font-weight:600;font-size:20px;padding:0 6px}
.mbox .pick,.pick{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:8px;font-size:15px;line-height:1.3;cursor:pointer;margin:0!important;font-weight:400!important}
.pick:hover{background:#F9F7EE}
.pick input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--teal)}
.pick .ti{color:var(--muted);font-size:18px;flex:none}
.pick .pt{flex:1;min-width:0}
.pick .pn{display:block;font-size:13px;color:var(--muted)}
.pick .tag{margin-left:4px}
.pick.ro{cursor:default}
.pick[hidden],.land[hidden]{display:none!important}
.pcount{font-size:15px;font-weight:500;color:var(--teal-ink);margin-right:auto;align-self:center}
.mbox.wide .mrow{position:sticky;bottom:-24px;background:var(--paper);padding:12px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line)}
.pfilters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note{margin-top:8px;min-height:42px;height:42px;resize:vertical;font-size:15px;background:#F9F7EE;border-color:var(--line)}
.rfoot{font-size:13px;color:var(--muted);margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rfoot button{min-height:34px;padding:5px 12px;font-size:13px;color:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,52,46,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:16px;max-width:540px;width:100%;padding:24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.mbox.wide{max-width:820px}
.mbox h3{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 6px}
.mbox p{margin:6px 0 12px;font-size:16px;color:var(--muted)}
.mbox label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.mbox .opt{font-weight:400;color:var(--faint)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.types{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--red);font-size:14px;margin-top:6px;min-height:0}
.status{font-size:18px;display:flex;gap:10px;align-items:center;margin:8px 0}
.status .big{font-size:30px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tripsum{background:var(--teal-soft);color:var(--teal-ink);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:12px;min-height:20px}
.tripsum:empty{display:none}

/* maio x setembro */
.season{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.scol{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.scol h4{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 6px}
.scol ul{margin:0;padding-left:18px;font-size:15px}
.scol li{margin:5px 0}
.scol.may{border-top:4px solid var(--teal)}
.scol.sep{border-top:4px solid var(--coral)}
.both{margin-top:12px;background:#F9F7EE;border-radius:12px;padding:10px 14px;font-size:15px}
.both ul{margin:4px 0 0;padding-left:18px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.canundo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
#toast .undo{background:#fff;color:var(--ink);border:0;font-weight:700;min-height:38px;padding:6px 16px;font-size:15px}
#toast .undo:hover{background:var(--coral-soft)}

@media (max-width:980px){
  body{height:auto;display:block}
  .cols{grid-template-columns:1fr;display:block}
  .col{overflow:visible}
  .lefthead,.righthead{position:static}
  #intro ol{flex-direction:column;gap:10px}
  .top{flex-direction:column;align-items:flex-start;padding:16px}
  .langs{right:16px}
  .top .actions{margin-top:4px}
  .actions{justify-content:flex-start}
  .slots{grid-template-columns:1fr}

<body>

<header class="top">
  <div class="brand">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="by" data-t="by"></p>
  </div>
  <div class="langs" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="pt">PT</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div class="actions">
    <span id="progress"></span>
    <span id="autosave"><i class="ti ti-check" aria-hidden="true"></i> <span data-t="autosave"></span></span>
    <button id="btnTrip" class="ghost" type="button"><i class="ti ti-calendar" aria-hidden="true"></i><span id="tripLabel"></span></button>
    <button id="btnSeason" class="ghost" type="button"><i class="ti ti-sun" aria-hidden="true"></i><span data-t="season"></span></button>
    <button id="btnCopy" class="ghost" type="button" data-t="copy"></button>
    <button id="btnSave" class="primary" type="button" data-t="save"></button>
  </div>
</header>

<section id="intro" aria-label="Como funciona">
  <ol>
    <li><span class="n">1</span><span data-t="i1"></span></li>
    <li><span class="n">2</span><span data-t="i2"></span></li>
    <li><span class="n">3</span><span data-t="i3"></span></li>
  </ol>
  <button type="button" id="introClose" data-t="gotit"></button>
</section>
<button type="button" id="introMini" class="hide" aria-expanded="false"><i class="ti ti-help-circle" aria-hidden="true"></i> <span data-t="howitworks"></span> <i class="ti ti-chevron-down" aria-hidden="true"></i></button>

<div id="selbar" hidden>
  <i class="ti ti-hand-click" aria-hidden="true"></i>
  <span><span data-t="chosen"></span> <b id="selname"></b>. <span data-t="nowclick"></span></span>
  <button type="button" id="selCancel" data-t="cancel"></button>
</div>

<main class="cols">
  <section class="col" id="leftCol">
    <div class="lefthead">
      <h2 data-t="places"></h2>
      <input id="q" type="search">
      <div class="chips" id="chips"></div>
      <div class="found" id="found"></div>
    </div>
    <div id="catalog"></div>
    <p class="credit" data-t="credit"></p>
  </section>

  <section class="col" id="rightCol">
    <div class="righthead">
      <h2 data-t="mydays"></h2>
      <div id="cal"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="days"></div>
    <div class="rfoot">
      <span data-t="footnote"></span>
      <button type="button" id="btnDownload" data-t="download"></button>
      <button type="button" id="btnReset" data-t="reset"></button>
      <span class="ver" id="ver"></span>
    </div>
  </section>
</main>

 'Ilha de Cataguases, Ilhas Botinas (snorkel, sem desembarque), Praia do Dentista e Piedade, na Gipoia, mais almoço. De 6 a 7 horas, saída 10h30. De R$ 160 a R$ 190 nos sites. No Dentista o barco não encosta: precisa nadar um pouco.',
 'Cataguases island, the Botinas islets (snorkelling, no landing), Praia do Dentista and Piedade on Gipoia, plus lunch. 6 to 7 hours, leaving 10:30am. R$ 160 to R$ 190 on the websites. At Dentista the boat does not reach the sand: you swim a little.','sailboat'],
/* barco: privativo e especiais */
['ba30','barco','priv','Lancha privativa','Private speedboat',1,'D','','','','','',
 'Escolhe o roteiro e o horário. Nos sites, de R$ 1.800 a R$ 3.290 pela lancha conforme o roteiro (Super Sul e Gruta do Acaiá são os mais caros). Para 3 pessoas pesa, vale juntar mais gente.',
 'You pick the route and times. On the websites, R$ 1,800 to R$ 3,290 for the boat depending on route (Super Sul and Gruta do Acaiá cost the most). For 3 people it is steep, worth sharing.','speedboat'],
['ba31','barco','priv','Lancha com churrasco a bordo','Speedboat with a barbecue on board',0,'D','','','','','',
 'Privativa com churrasqueira, parando nas lagoas. Oferecido pela Abraão Tour. Preço sob consulta.',
 'Private boat with a grill, stopping at the lagoons. Offered by Abraão Tour. Price on request.','grill'],
['ba32','barco','priv','Pôr do sol no lado norte','Sunset on the north side',0,'2h','s,n','','','','',
 'Saída curta no fim da tarde para o lado calmo da ilha. Várias agências fazem, às vezes só na alta temporada.',
 'A short late-afternoon outing to the calm side of the island. Several agencies run it, sometimes only in high season.','sunset-2'],
['ba33','barco','priv','Jantar no Saco do Céu','Dinner at Saco do Céu',0,'3h','n,h','','','','',
 'Saída à noite para jantar na enseada do Saco do Céu, de água parada e céu estrelado. Abraão Tour vende. Conferir o cardápio, a região é forte em peixe.',
 'An evening boat to dinner in the still Saco do Céu cove under the stars. Sold by Abraão Tour. Check the menu, the area leans heavily on fish.','moon-stars'],
['ba34','barco','priv','Canoa polinésia','Polynesian canoe',2,'2h','s,h','','','','',
 'Remada em grupo ao nascer ou ao pôr do sol, saindo da praia do Abraão. Abraão Tour oferece. Exercício e vista ao mesmo tempo.',
 'Group paddling at sunrise or sunset from Abraão beach. Offered by Abraão Tour. Exercise and a view at once.','kayak'],
/* barco: na água */
['ba40','barco','agua','Mergulho de batismo','Discover scuba dive',1,'D','a','','','','',
 'Primeiro mergulho de cilindro com instrutor, sem curso. Adventure Boat cobra R$ 600 com saída 10h30. Outros centros cobram entre R$ 450 e R$ 500 (conferir). Não voar nas 24 horas seguintes.',
 'A first scuba dive with an instructor, no course needed. Adventure Boat charges R$ 600, leaving 10:30am. Other centres charge R$ 450 to R$ 500 (check). Do not fly in the following 24 hours.','scuba-mask'],
['ba41','barco','agua','Mergulho para credenciados','Dives for certified divers',1,'D','a,h','','','','',
 'Naufrágios e costões da baía. Centros com cadastro PADI na região: Elite Dive Center, Dive Cia e Jamanta Dive Center (conferir quais saem do Abraão).',
 'Wrecks and rocky reefs around the bay. PADI-listed centres in the area: Elite Dive Center, Dive Cia and Jamanta Dive Center (check which leave from Abraão).','scuba-mask'],
['ba42','barco','agua','Caiaque ou SUP','Kayak or SUP',1,'2h','b,k','','','','',
 'Aluga na praia do Abraão e rema até a Praia do Canto ou Júlia. Melhor de manhã, antes do vento.',
 'Rent one on Abraão beach and paddle to Praia do Canto or Júlia. Best in the morning, before the wind.','kayak'],
['ba43','barco','agua','Táxi-boat para as praias perto','Water taxi to nearby beaches',0,'30 min','k','','','','',
 'Barquinhos no cais levam a Crena, Abraãozinho, Feiticeira e outras, e buscam na hora combinada. Preço combinado com o barqueiro, por pessoa, quase sempre em dinheiro.',
 'Small boats at the pier run to Crena, Abraãozinho, Feiticeira and others, and pick you up at a set time. Price agreed with the boatman, per person, nearly always cash.','speedboat'],
['ba44','barco','agua','Snorkel por conta própria','Snorkelling on your own',0,'H','b,g','','','','',
 'Aluga máscara na vila e leva para a Lagoa Azul, Praia Preta ou o Poção. Pergunte se o seu passeio já inclui.',
 'Rent a mask in the village and take it to Lagoa Azul, Praia Preta or the Poção. Ask whether your tour already includes one.','swimming'],
/* trilhas saindo do Abraão */
['tr01','trilhas','tabr','T1 Circuito do Abraão','T1 Abraão circuit',1,'2h','b,k,g','','','','Vila do Abraão',
 'Cerca de 1,8 km, leve. Sede do parque com a maquete da ilha, Praia Preta de areia escura, ruínas do Lazareto, aqueduto e o Poção, uma piscina natural no rio. Ótimo no primeiro dia ou com mar ruim.',
 'About 1.8 km, easy. The park office with a model of the island, dark-sand Praia Preta, the Lazareto ruins, the aqueduct and the Poção, a natural river pool. Great on day one or when the sea is rough.','trekking'],
['tr02','trilhas','tabr','T2 Aqueduto até Saco do Céu (via Feiticeira)','T2 Aqueduct to Saco do Céu (via Feiticeira)',2,'H','b,g','','','','',
 'Cerca de 1 hora até a Cachoeira da Feiticeira, mais 20 minutos até a praia. Dá para voltar de táxi-boat. Seguindo até o Saco do Céu são uns 5 km só de ida.',
 'About 1 hour to the Feiticeira waterfall, 20 more minutes to the beach. You can return by water taxi. Carrying on to Saco do Céu is about 5 km one way.','trekking'],
['tr03','trilhas','tabr','T10 e T11 Abraão até Lopes Mendes a pé','T10 and T11 Abraão to Lopes Mendes on foot',2,'D','b,g,v','','','','Praia de Lopes Mendes',
 'Cerca de 3 horas de ida, com uma serra logo no começo. Passa por Palmas, Mangues e Pouso. Sem quiosques no caminho: levar água e almoço. Volta de barco do Pouso à tarde.',
 'About 3 hours one way, with a climb right at the start. Passes Palmas, Mangues and Pouso. No kiosks on the way: carry water and lunch. Boat back from Pouso in the afternoon.','trekking'],
['tr04','trilhas','tabr','T14 Abraão até Dois Rios','T14 Abraão to Dois Rios',2,'D','b,g','','','','Instituto Penal Cândido Mendes',
 'Cerca de 7 a 8 km de ida, de 2h30 a 3h, por estrada de terra antiga com subida longa. Chega na vila do antigo presídio, com museu, praia e rio. Volta pelo mesmo caminho: sair cedo.',
 'About 7 to 8 km one way, 2h30 to 3h, on an old dirt road with a long climb. Arrives at the old prison village, with a museum, beach and river. Same way back: start early.','trekking'],
['tr05','trilhas','tabr','T13 Pico do Papagaio','T13 Pico do Papagaio',3,'D','a,v,b','','','','Pico do Papagaio (Ilha Grande)',
 'O ponto mais alto, perto de 980 m, com vista da baía inteira. Cerca de 6 horas ida e volta, a mais difícil da ilha. Guia muito recomendado. Sair antes do meio-dia, ou fazer a versão noturna guiada para ver o sol nascer (cerca de R$ 170 a R$ 375). Reserva no INEA em fim de semana (conferir).',
 'The highest point, about 980 m, with a view over the whole bay. About 6 hours return, the hardest trail on the island. A guide is strongly advised. Set off before noon, or join the guided night hike for sunrise (about R$ 170 to R$ 375). INEA booking at weekends (check).','mountain'],
['tr06','trilhas','tabr','Caminho das praias da vila','Village beaches path',1,'H','b,g,k','','','','',
 'Da Praia do Canto até Júlia, Bica, Crena e Abraãozinho, cerca de 50 minutos. Leve, com sombra. Volta de táxi-boat.',
 'From Praia do Canto to Júlia, Bica, Crena and Abraãozinho, about 50 minutes. Easy and shaded. Water taxi back.','trekking'],
/* trilhas mais longe */
['tr10','trilhas','tlon','T3 Saco do Céu até Freguesia de Santana','T3 Saco do Céu to Freguesia de Santana',2,'H','','','','','',
 'Cerca de 4 km, 2 horas. Mata densa, subidas curtas e íngremes, chega na igreja de Santana do século XVIII.',
 'About 4 km, 2 hours. Dense forest, short steep climbs, ending at the 18th-century Santana church.','trekking'],
['tr11','trilhas','tlon','T4 e T5 Freguesia, Bananal e Sítio Forte','T4 and T5 Freguesia, Bananal and Sítio Forte',2,'D','h','','','','',
 'Uns 8 km no total. Vista da Lagoa Azul do mirante do Bananal, figueiras enormes e tartarugas no Sítio Forte.',
 'About 8 km in all. Lagoa Azul from the Bananal lookout, giant fig trees and turtles at Sítio Forte.','trekking'],
['tr12','trilhas','tlon','T6 e T7 Araçatiba e Gruta do Acaiá','T6 and T7 Araçatiba and Gruta do Acaiá',2,'D','h','','','','',
 'De Araçatiba até a gruta são uns 5 km, cerca de 3 horas. Taxa pequena paga a um morador na entrada da gruta.',
 'From Araçatiba to the cave is about 5 km, around 3 hours. A small fee paid to a local at the cave entrance.','trekking'],
['tr13','trilhas','tlon','T8 e T9 Provetá até Aventureiro','T8 and T9 Provetá to Aventureiro',3,'D','a,h','','1','','',
 'A T9 é das mais radicais da ilha, com descidas muito íngremes. Água de riacho precisa ser tratada. Para quem dorme numa das vilas.',
 'T9 is one of the toughest on the island, with very steep descents. Stream water needs treating. For people staying in one of the villages.','trekking'],
['tr14','trilhas','tlon','T12 Pouso até o Farol dos Castelhanos','T12 Pouso to Farol dos Castelhanos',3,'D','a,h','','','','',
 'Uns 6 km de ida, piscina natural do Jurubá e o farol. Muitas bifurcações: guia recomendado. Não seguir para o farol depois das 13h.',
 'About 6 km one way, the Jurubá natural pool and the lighthouse. Many forks: a guide is advised. Do not head for the lighthouse after 1pm.','building-lighthouse'],
['tr15','trilhas','tlon','T15 Dois Rios até Caxadaço','T15 Dois Rios to Caxadaço',3,'H','h','','','','',
 'Cerca de 4 km e 2h30 de ida. Praia pequena e escondida, com tartarugas.',
 'About 4 km and 2h30 one way. A small hidden beach with turtles.','trekking'],
['tr16','trilhas','tlon','T16 Dois Rios até Parnaioca','T16 Dois Rios to Parnaioca',3,'D','a','','1','','',
 'O trecho mais longo de praia a praia, cerca de 7,5 km. Não sair de Dois Rios depois das 14h. Pode ter limite de visitantes em feriado.',
 'The longest beach-to-beach stretch, about 7.5 km. Do not leave Dois Rios after 2pm. May have a visitor cap on holidays.','trekking'],
['tr17','trilhas','tlon','Volta à ilha a pé com guia','Island loop on foot with a guide',3,'D','a','','1','','',
 'Cerca de 70 km em 4 a 5 dias, passando por umas 20 praias. Precisa de guia credenciado pelo parque. O trecho Aventureiro e Parnaioca é feito de barco, porque a reserva não deixa caminhar.',
 'About 70 km over 4 to 5 days, passing some 20 beaches. Needs a park-accredited guide. The Aventureiro to Parnaioca stretch is done by boat, as walking through the reserve is not allowed.','map-2'],

/* praias */
['pr01','praias','pvila','Praia do Canto','Praia do Canto',0,'2h','p,k,b,g','','','','',
 'Logo depois da vila, água calma e restaurantes. Ponto de partida da caminhada para as outras praias.',
 'Just past the village, calm water and restaurants. The starting point for the walk to the other beaches.','beach'],
['pr02','praias','pvila','Praia da Júlia e Praia da Bica','Praia da Júlia and Praia da Bica',0,'2h','p,b,g','','','','',
 'Duas pequenas e tranquilas no caminho. A Bica tem uma bica de água doce e quase some na maré alta.',
 'Two small quiet ones on the path. Bica has a freshwater spout and almost disappears at high tide.','beach'],
['pr03','praias','pvila','Praia da Crena','Praia da Crena',0,'H','p,k,b','','','','',
 'Pequena, de água esverdeada e calma, com quiosque e chuveiro. Também chega de táxi-boat.',
 'Small, with calm green water, a kiosk and a shower. Also reachable by water taxi.','beach'],
['pr04','praias','pvila','Praia do Abraãozinho','Praia do Abraãozinho',0,'H','p,k,b','','','','',
 'Fim do caminho das praias, com bar e estrutura. Boa para almoçar e voltar de táxi-boat.',
 'The end of the beach path, with a bar and facilities. Good for lunch and a water taxi back.','beach'],
['pr05','praias','pvila','Praia Preta','Praia Preta',0,'2h','p,b,g,k','','','','',
 'Areia escura de minerais, água calma, a 15 minutos da vila pela T1. Fica no caminho do Lazareto.',
 'Dark mineral sand and calm water, 15 minutes from the village on T1. On the way to the Lazareto.','beach'],
['pr06','praias','pvila','Praia da Feiticeira','Praia da Feiticeira',1,'H','p,b','','','','',
 'Água calma, sombra e nada de estrutura. Junta com a cachoeira. Volta de táxi-boat.',
 'Calm water, shade and no facilities. Combine with the waterfall. Water taxi back.','beach'],
['pr10','praias','plon','Lopes Mendes de barco','Lopes Mendes by boat',1,'D','p,v','','','','Praia de Lopes Mendes',
 'A praia mais famosa da ilha, 3 km de areia branca e mar de surfe. Barco até o Pouso (R$ 40 a R$ 80 ida e volta conforme a agência) e 30 minutos de trilha. Saídas a partir de 9h30, última volta perto das 17h30. Sem quiosques: levar lanche.',
 'The island\'s most famous beach, 3 km of white sand and surf. Boat to Pouso (R$ 40 to R$ 80 return depending on agency) and a 30-minute trail. Departures from 9:30am, last boat back around 5:30pm. No kiosks: bring a packed lunch.','beach'],
['pr11','praias','plon','Praia de Santo Antônio','Praia de Santo Antônio',1,'2h','p,h','','','','',
 'Escondida, a 10 ou 15 minutos do canto de Lopes Mendes. A entrada não tem placa: procure o caminho à direita.',
 'Hidden, 10 to 15 minutes from the end of Lopes Mendes. The turn has no sign: look for a path on the right.','beach'],
['pr12','praias','plon','Praia do Pouso','Praia do Pouso',0,'2h','p,k','','','','',
 'Onde os barcos de Lopes Mendes param. Calma, com restaurante flutuante para esperar o barco da volta.',
 'Where the Lopes Mendes boats land. Calm, with a floating restaurant for waiting on the boat back.','beach'],
['pr13','praias','plon','Dois Rios','Dois Rios',1,'H','p,h','','','','',
 'Praia larga entre dois rios, na vila do antigo presídio. Pela T14 ou no Super Sul.',
 'A wide beach between two rivers, at the old prison village. Via T14 or on the Super Sul trip.','beach'],
['pr14','praias','plon','Lagoa Azul por conta própria','Lagoa Azul on your own',0,'H','h','','','','',
 'Truque: táxi-boat cedo, antes das escunas das 11h, e você pega a lagoa quase vazia. Combinar o preço na véspera.',
 'Tip: an early water taxi, before the 11am schooners, and you get the lagoon almost to yourself. Agree the price the day before.','swimming'],

/* vila e história */
['va01','vila','','Igreja de São Sebastião','São Sebastião church',0,'30 min','b,c,g','','','','',
 'A igrejinha branca na praça, cartão-postal da vila. A feirinha de artesanato fica na praça à noite.',
 'The little white church on the square, the village\'s postcard. The craft fair sets up on the square at night.','building-church'],
['va02','vila','','Centro de Visitantes do Parque','Park visitor centre',0,'1h','b,c,g,k','','','','Parque Estadual da Ilha Grande',
 'Maquete da ilha inteira, mapas das trilhas e informação atualizada sobre fechamentos. Bom para planejar no primeiro dia.',
 'A model of the whole island, trail maps and current closure information. Good for planning on day one.','info-circle'],
['va03','vila','','Ruínas do Lazareto e Aqueduto','Lazareto ruins and aqueduct',0,'2h','b,g,v','','','','',
 'Restos do antigo hospital de quarentena do século XIX, que depois virou presídio, e o aqueduto de pedra coberto de mata. Pela T1.',
 'Remains of the 19th-century quarantine hospital, later a prison, and the moss-covered stone aqueduct. Via T1.','building-arch'],
['va04','vila','','Poção e Cachoeira dos Escravos','Poção and Cachoeira dos Escravos',1,'2h','b,g,k','','','','',
 'Piscina natural de rio a uns 30 minutos da vila. Enche em fim de semana e feriado: ir cedo.',
 'A natural river pool about 30 minutes from the village. Busy at weekends and holidays: go early.','droplet'],
['va05','vila','','Museu do Cárcere em Dois Rios','Prison museum at Dois Rios',2,'D','b,c,h','','','','Instituto Penal Cândido Mendes',
 'Conta a história do Instituto Penal Cândido Mendes, desativado em 1994. Chega pela T14 ou no Super Sul. Conferir horário antes de ir.',
 'Tells the story of the Cândido Mendes prison, closed in 1994. Reach it via T14 or on the Super Sul trip. Check opening hours first.','building'],
['va06','vila','','Festa de São Sebastião','São Sebastião festival',0,'N','n','','','','',
 'O padroeiro do Abraão é festejado perto de 20 de janeiro, com procissão e barracas. Data e programação mudam a cada ano: conferir.',
 'Abraão\'s patron saint is celebrated around 20 January, with a procession and stalls. Dates and programme change each year: check.','confetti'],
['va07','vila','','Réveillon no Abraão','New Year\'s Eve in Abraão',0,'N','n','','','','',
 'Fogos na baía e praia lotada. Pousada e travessia esgotam cedo: reservar com meses de antecedência.',
 'Fireworks over the bay and a packed beach. Rooms and crossings sell out early: book months ahead.','sparkles'],
['va08','vila','','Festa de Santana na Freguesia','Santana festival at Freguesia',0,'N','h','','','','',
 'A igreja de Santana, do século XVIII, costuma festejar a santa perto de 26 de julho. Conferir se e quando acontece no ano.',
 'The 18th-century Santana church usually honours the saint around 26 July. Check whether and when it happens that year.','building-church'],
['va09','vila','','Pôr do sol na praia do Abraão','Sunset on Abraão beach',0,'1h','s,g,b','','','','',
 'A praia da vila não é a melhor para banho, mas o pôr do sol para o lado do continente compensa. Sorvete no Finlandês e mureta.',
 'The village beach is not the best for swimming, but the sunset over the mainland makes up for it. Ice cream from Finlandês on the sea wall.','sunset-2'],
['va10','vila','','Feirinha e noite na vila','Craft fair and village nights',0,'N','n,g,b','','','','',
 'Feira de artesanato na praça toda noite e bares com música. Às segundas reggae e às quartas forró no Aquário (conferir).',
 'A craft fair on the square every night and bars with music. Reggae on Mondays and forró on Wednesdays at Aquário (check).','music'],
['va11','vila','','Freguesia de Santana','Freguesia de Santana',0,'1h','h','','','','',
 'Vila caiçara com a igreja mais antiga da ilha. Parada de várias escunas da Lagoa Azul, ou pela T3.',
 'A caiçara village with the oldest church on the island. A stop on several Lagoa Azul schooners, or via T3.','building-church'],

['dp14','dormir','dvil','Pousada Caúca','Pousada Caúca',0,'','','','','','',
 'Simples, bonita e bem localizada perto do centrinho, segundo quem ficou. Preço no site de reserva.',
 'Simple, pretty and well placed near the centre, say people who stayed. Price on booking sites.','bed'],
['dp20','dormir','dmat','Pousada Mata Nativa','Pousada Mata Nativa',0,'','k','','','','',

['dp21','dormir','dmat','Pousada Riacho dos Cambucás','Pousada Riacho dos Cambucás',0,'','','','','','',

function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }
function addDays(dt, n){ return new Date(dt.getTime() + n*86400000); }
function nthWeekday(y, m, wd, n){ // n=1 primeiro; n=-1 último
  if (n > 0) { const d = new Date(Date.UTC(y, m, 1)); const off = (wd - d.getUTCDay() + 7) % 7; return Date.UTC(y, m, 1 + off + (n-1)*7); }
  const d = new Date(Date.UTC(y, m+1, 0)); const off = (d.getUTCDay() - wd + 7) % 7; return Date.UTC(y, m, d.getUTCDate() - off);
}
const HOLCACHE = {};
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return Date.UTC(y,mo-1,da); }
function holidays(y){
  if (HOLCACHE[y]) return HOLCACHE[y];
  const H = {}, add = (ms, pt, en) => H[iso(new Date(ms))] = [pt, en];
  const E = easter(y), D = 86400000;
  add(Date.UTC(y,0,1),'Ano Novo','New Year');
  add(Date.UTC(y,0,6),'Dia de Reis em Angra (conferir)','Epiphany in Angra (check)');
  add(Date.UTC(y,0,20),'São Sebastião, padroeiro do Abraão','São Sebastião, Abraão patron saint');
  add(E - 48*D,'Carnaval','Carnival'); add(E - 47*D,'Carnaval','Carnival');
  add(E - 2*D,'Sexta-feira Santa','Good Friday');
  add(Date.UTC(y,3,21),'Tiradentes','Tiradentes Day');
  add(Date.UTC(y,3,23),'São Jorge, feriado no estado do Rio','São Jorge, Rio state holiday');
  add(Date.UTC(y,4,1),'Dia do Trabalho','Labour Day');
  add(Date.UTC(y,8,7),'Independência','Independence Day');

  add(Date.UTC(y,10,20),'Consciência Negra','Black Consciousness Day');

}

  if (S.trip.mode === 'dates') {
    const a = parseISO(S.trip.start), b = parseISO(S.trip.end);
    const n = Math.round((b - a) / 86400000) + 1;
    for (let i = 0; i < n; i++) {
      const dt = addDays(a, i);
      DAYS.push({i, date:iso(dt), wdN:dt.getUTCDay(), d:dt.getUTCDate(), mN:dt.getUTCMonth(), y:dt.getUTCFullYear(), hol:holidays(dt.getUTCFullYear())[iso(dt)] || null});
    }
  } else {
    for (let i = 0; i < S.trip.n; i++) DAYS.push({i, date:null, hol:null});

function fmtDate(s){ const d = parseISO(s); return d.getUTCDate() + ' ' + MO[S.lang][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function tripSummary(trip){
  if (!trip) return '';
  if (trip.mode === 'dates') { const n = Math.round((parseISO(trip.end) - parseISO(trip.start)) / 86400000) + 1; return fill(t('sumDates'), {n, a:fmtDate(trip.start), b:fmtDate(trip.end)}); }
  return fill(t('sumCount'), {n:trip.n});
}

function tripShort(trip){
  if (trip.mode !== 'dates') return trip.n + ' ' + t('days');
  const a = parseISO(trip.start), b = parseISO(trip.end), sep = S.lang === 'en' ? ' to ' : ' a ';
  const f = (d, y) => d.getUTCDate() + ' ' + MO[S.lang][d.getUTCMonth()] + (y ? ' ' + d.getUTCFullYear() : '');
  return f(a, a.getUTCFullYear() !== b.getUTCFullYear()) + sep + f(b, true);
}
/* época de cada cartão */
function windowLabel(w){
  const f = s => { const [m,d] = s.split('-').map(Number); return d + ' ' + MO[S.lang][m-1]; };
  return f(w[0]) + (S.lang === 'en' ? ' to ' : ' a ') + f(w[1]) + (w[2] ? ' ' + w[2] : '');
}
function seasonStatus(c){
  const w = WINDOWS[c.id]; if (!w) return null;
  if (!S.trip || S.trip.mode !== 'dates') return 'na';
  const a = parseISO(S.trip.start), b = parseISO(S.trip.end);
  for (let y = a.getUTCFullYear() - 1; y <= b.getUTCFullYear(); y++) {
    if (w[2] && y < w[2]) continue;
    const ws = parseISO(y + '-' + w[0]);
    let we = parseISO(y + '-' + w[1]);
    if (we < ws) we = parseISO((y+1) + '-' + w[1]);
    if (ws <= b && we >= a) return 'in';
  }
  return 'out';
}

}

/* ===== fotos (Wikipedia) ===== */
let THUMBS = {};
try { THUMBS = JSON.parse(localStorage.getItem(CONFIG.THUMBS_KEY) || '{}'); } catch(e) { THUMBS = {}; }
const pending = {};
function loadThumb(title){
  if (!title) return Promise.resolve(null);
  if (title in THUMBS) return Promise.resolve(THUMBS[title]);
  if (pending[title]) return pending[title];
  pending[title] = fetch('https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=240&titles=' + encodeURIComponent(title))
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
      const p = pages.find(x => x.thumbnail);
      const src = p ? p.thumbnail.source : null;
      THUMBS[title] = src;
      try { localStorage.setItem(CONFIG.THUMBS_KEY, JSON.stringify(THUMBS)); } catch(e) {}
      return src;
    }).catch(() => null);
  return pending[title];
}
function hydrateThumbs(root){
  root.querySelectorAll('.thumb[data-w]').forEach(el => {
    const w = el.dataset.w; el.removeAttribute('data-w');
    loadThumb(w).then(src => {
      if (!src) return;
      const img = new Image(); img.alt = ''; img.loading = 'lazy';
      img.onload = () => img.classList.add('ok'); img.onerror = () => img.remove();
      img.src = src; el.appendChild(img);
    });
  });
}

  refreshAfterChange([i]);

}
function moveItem(from, i, p){
  i = +i; const fd = +from.d; const id = S.days[fd][from.p][from.i]; if (!id) return;
  if (CARD[id] && CARD[id].dur === 'D') p = 'D';
  S.days[fd][from.p].splice(from.i, 1); S.days[i][p].push(id);

}

function tripForm(){

    </div>

      <div><label for="tStart">${t('arrive')}</label><input type="date" id="tStart" min="${today}" value="${tr.start || ''}"></div>
      <div><label for="tEnd">${t('leave')}</label><input type="date" id="tEnd" min="${today}" value="${tr.end || ''}"></div>
    </div></div>
    <div id="mCount" ${mode === 'count' ? '' : 'hidden'}><label for="tN">${t('howMany')}</label><input type="number" id="tN" min="1" max="${CONFIG.MAX_DAYS}" value="${tr.n || 10}" style="max-width:140px"></div>

    <div class="err" id="tErr"></div>

  const box = $('#mbox');

    if (mode === 'dates') {
      const a = $('#tStart').value, b = $('#tEnd').value;
      if (!a || !b) return {err:t('needDates')};
      const n = Math.round((parseISO(b) - parseISO(a)) / 86400000) + 1;
      if (n < 1) return {err:t('badRange')};
      if (n > CONFIG.MAX_DAYS) return {err:fill(t('tooMany'), {n:CONFIG.MAX_DAYS})};
      return {trip:{mode:'dates', start:a, end:b, n}};
    }
    const n = Math.round(+$('#tN').value);
    if (!(n >= 1)) return {err:t('needDates')};
    if (n > CONFIG.MAX_DAYS) return {err:fill(t('tooMany'), {n:CONFIG.MAX_DAYS})};
    return {trip:{mode:'count', n, start:tr.start || '', end:tr.end || ''}};
  };
  const update = () => {
    const r = read(); $('#tErr').textContent = '';
    if (r.err) { $('#tSum').textContent = ''; return; }
    let msg = tripSummary(r.trip);
    const hidden = []; for (let i = r.trip.n; i < S.days.length; i++) if (dayFilled(i)) hidden.push(i + 1);
    if (hidden.length) msg += '. ' + fill(t(hidden.length === 1 ? 'hiddenWarn1' : 'hiddenWarn'), {list:hidden.join(', ')});
    $('#tSum').textContent = msg;
  };
  box.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;

    $('#mDates').hidden = mode !== 'dates'; $('#mCount').hidden = mode !== 'count'; update();
  }));
  $('#tStart').addEventListener('change', () => { if ($('#tStart').value && (!$('#tEnd').value || $('#tEnd').value < $('#tStart').value)) { $('#tEnd').value = iso(addDays(parseISO($('#tStart').value), 7)); } $('#tEnd').min = $('#tStart').value; update(); });
  $('#tEnd').addEventListener('change', update);
  $('#tN').addEventListener('input', update);
  update();
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  $('#tOk').addEventListener('click', () => {
    const r = read();
    if (r.err) { $('#tErr').textContent = r.err; return; }
    const first = !S.trip;
    S.trip = r.trip; buildDays(); closeModal(); renderAll(); saveNow();
    toast(first ? tripSummary(S.trip) : t('tripChanged'));
  });
}

/* ===== o plano em texto ===== */
function stamp(){ const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function buildMarkdown(){
  const out = [], l = L(), en = S.lang === 'en';
  const filled = DAYS.filter(D => dayFilled(D.i)).length;
  out.push(t('mdTitle'));
  out.push((en ? 'Saved: ' : 'Salvo em: ') + stamp());
  out.push((en ? 'Trip: ' : 'Viagem: ') + (S.trip ? tripSummary(S.trip) : '-'));
  out.push((en ? 'Days with a plan: ' : 'Dias com plano: ') + filled + ' ' + t('of') + ' ' + DAYS.length);
  out.push('');
  out.push(en ? '## My ideas' : '## Minhas ideias');
  if (!S.ideas.length) out.push(en ? '- none' : '- nenhuma');
  S.ideas.forEach(x => out.push(`- [${x.id}] ${x.n} | ${x.tipo} | ${t('where')}: ${x.onde || '-'} | ${t('note')}: ${x.nota || '-'}`));
  DAYS.forEach(D => {
    const day = S.days[D.i], last = D.i === DAYS.length - 1;
    const extra = [];
    if (D.i === 0) extra.push(t('arrival'));
    if (last && DAYS.length > 1) extra.push(t('departure'));
    if (D.hol) extra.push(t('holiday') + ': ' + D.hol[l]);
    out.push('');
    out.push(`## ${t('day')} ${D.i + 1}${D.date ? ', ' + WD[S.lang][D.wdN] + ' ' + dayShort(D) : ''}${extra.length ? ' (' + extra.join(', ') + ')' : ''}`);
    out.push((en ? 'Day note: ' : 'Nota do dia: ') + (day.note.trim() ? day.note.trim().replace(/\s*\n\s*/g, ' / ') : '-'));
    SLOTS.forEach(p => {
      if (p === 'D' && !day.D.length) return;
      out.push('### ' + pLabel(p));
      if (!day[p].length) out.push(en ? '- empty' : '- vazio');
      day[p].forEach(id => {
        const c = itemInfo(id); if (!c) return;
        const bits = [];
        if (c.food) bits.push(t('eat').toLowerCase());
        if (c.sub && SUB[c.sub]) bits.push(SUB[c.sub].n[l]);
        else if (GROUP[c.g] && c.g !== 'ideias') bits.push(GROUP[c.g].n[l]);
        if (seasonStatus(c) === 'out') bits.push(t('outDates').toLowerCase());
        out.push(`- [${id}] ${c.n[l]}${bits.length ? ' (' + bits.join(', ') + ')' : ''}`);
        const pk = day.picks && day.picks[id];
        if (pk && pk.length) out.push(`  - ${t('wantsTo')}: ${pk.map(pickName).join(', ')}`);
      });
    });
  });
  return out.join('\n');
}
function copyPlan(){
  const md = buildMarkdown(); const done = () => toast(t('copied'));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(md).then(done, () => fallbackCopy(md, done)); else fallbackCopy(md, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { toast(t('copyFail')); }
  ta.remove();
}
function downloadPlan(){
  const blob = new Blob([buildMarkdown()], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = t('dlName');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function savePlan(){
  if (!S.trip) { toast(t('needTrip')); tripForm(); return; }
  saveNow();
  const filled = DAYS.filter(D => dayFilled(D.i)).length;
  openModal(`<h3>${t('saving')}</h3><div class="status"><span class="spin"><i class="ti ti-loader-2" aria-hidden="true"></i></span> ${t('sending')}</div>`);
  const md = buildMarkdown();
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
  let ok = false, msg = '';
  try {
    const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(CONFIG.SEND_TO), {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:TX.pt.mailSubj + stamp(), _template:'box', _captcha:'false', Viagem:tripSummary(S.trip), Dias_com_plano:filled + ' / ' + DAYS.length, Plano:md})
    });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && (j.success === true || j.success === 'true'); msg = j.message || '';
  } catch(e) { ok = false; }
  clearTimeout(tm);
  if (ok) {
    openModal(`<h3>${t('saved')}</h3>
      <div class="status"><span class="big" style="color:var(--green)"><i class="ti ti-circle-check" aria-hidden="true"></i></span><span>${t('savedMsg')}</span></div>
      <p>${t('savedMore')}</p><div class="mrow"><button type="button" class="primary" data-close="1">${t('ok')}</button></div>`);
  } else {
    openModal(`<h3>${t('failT')}</h3><p>${t('failMsg')} ${msg ? '<br><small>' + esc(msg) + '</small>' : ''}</p><p>${t('failMore')}</p>
      <div class="mrow"><button type="button" data-dl="1">${t('dlFile')}</button><button type="button" data-cp="1">${t('copy')}</button><button type="button" class="primary" data-retry="1">${t('retry')}</button></div>`);
    $('#mbox').querySelector('[data-dl]').addEventListener('click', downloadPlan);
    $('#mbox').querySelector('[data-cp]').addEventListener('click', copyPlan);
    $('#mbox').querySelector('[data-retry]').addEventListener('click', savePlan);
  }
  const c = $('#mbox').querySelector('[data-close]'); if (c) c.addEventListener('click', closeModal);
}
$('#btnSave').addEventListener('click', savePlan);
$('#btnCopy').addEventListener('click', copyPlan);
$('#btnDownload').addEventListener('click', downloadPlan);
$('#btnReset').addEventListener('click', () => {
  openModal(`<h3>${t('resetQ')}</h3><p>${t('resetMsg')}</p>
    <div class="mrow"><button type="button" data-close="1">${t('cancel')}</button><button type="button" class="primary" id="rOk">${t('eraseAll')}</button></div>`);
  $('#mbox').querySelector('[data-close]').addEventListener('click', closeModal);
  $('#rOk').addEventListener('click', () => { const snap = snapshot(); const lang = S.lang; S = blankState(); S.lang = lang; S.introHidden = true; buildDays(); setIntro(true); closeModal(); renderAll(); persist(); toast(t('wiped'), snap); });
});

/* ===== idioma ===== */
function applyLang(){
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'pt-BR';
  document.title = t('title');
  const v = document.getElementById('ver'); if (v) v.textContent = t('version') + ' ' + CONFIG.VERSION + ' · ' + CONFIG.BUILT;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  $('#h1').innerHTML = t('h1');
  $('#q').placeholder = t('search'); $('#q').setAttribute('aria-label', t('search'));
  document.querySelectorAll('[data-lang]').forEach(b => { b.classList.toggle('on', b.dataset.lang === S.lang); b.setAttribute('aria-pressed', b.dataset.lang === S.lang); });
}
document.querySelector('.langs').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === S.lang) return;
  S.lang = b.dataset.lang; saveNow(); applyLang(); renderAll(); if (sel) $('#selname').textContent = itemInfo(sel).n[L()];
});

/* ===== início ===== */
function renderAll(){ renderChips(); renderCatalog(); renderDays(); renderCal(); }
load();
buildDays();
applyLang();
setIntro(S.introHidden);
renderAll();
if (!S.trip) setTimeout(tripForm, 350);
$('#ver').textContent = t('version') + ' ' + CONFIG.VERSION + ' · ' + CONFIG.BUILT;
window.__plan = {buildMarkdown, state:() => S, cards:CARDS.length};
</script>
